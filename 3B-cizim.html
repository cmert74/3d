<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAN3D</title>
<style>
:root{
  --bg:#f5f5f5;--bg2:#ffffff;--bg3:#e8e8e8;
  --fg:#1a1a1a;--fg2:#444;--fg3:#888;
  --accent:#2563eb;--accent2:#1d4ed8;
  --border:#d0d0d0;--border2:#b0b0b0;
  --panel-w:220px;--rpanel-w:300px;
  --toolbar-h:44px;--statusbar-h:26px;
  --radius:6px;--shadow:0 1px 4px rgba(0,0,0,.12);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
  --fg:#e8e8e8;--fg2:#bbb;--fg3:#777;
  --border:#3a3a3a;--border2:#555;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:var(--fg);background:var(--bg)}

/* Üst çubuk */
#toolbar{display:flex;align-items:center;gap:4px;height:var(--toolbar-h);padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:100;position:relative}
#toolbar .sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.title{font-weight:700;font-size:15px;color:var(--accent);margin-right:8px;letter-spacing:.5px}
.tb-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--fg2);cursor:pointer;font-size:12px;transition:background .15s}
.tb-btn:hover{background:var(--bg3);border-color:var(--border2)}
.tb-btn .icon{font-size:14px}
#toolbar select{padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--fg);font-size:12px;cursor:pointer}
.spacer{flex:1}

/* Ana alan */
#main{display:flex;width:100%;height:calc(100% - var(--toolbar-h) - var(--statusbar-h))}

/* Sol panel */
#left-panel{width:var(--panel-w);min-width:160px;max-width:320px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;user-select:none;flex-shrink:0}
.panel-section{padding:8px 10px;border-bottom:1px solid var(--border)}
.panel-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--fg3);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.tool-btn{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--fg2);cursor:pointer;font-size:12px;transition:background .15s;text-align:left}
.tool-btn:hover{background:var(--bg3);border-color:var(--border)}
.tool-btn.active{background:var(--accent);color:#fff;border-color:var(--accent2)}
.tool-btn .icon{font-size:16px;min-width:20px;text-align:center}
.chk-row{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;margin-top:4px}
.small-btn{padding:3px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--fg2);cursor:pointer;white-space:nowrap}
.small-btn:hover{background:var(--bg3)}
.small-btn.danger{color:#dc2626;border-color:#fca5a5}
.small-btn.danger:hover{background:#fee2e2}
.small-btn.primary{color:#fff;background:var(--accent);border-color:var(--accent2)}
.small-btn.primary:hover{background:var(--accent2)}

/* 2B canvas */
#canvas-container{flex:1;position:relative;overflow:hidden;background:var(--bg);cursor:default}
#canvas2d{display:block;width:100%;height:100%}

/* Bölücü */
.divider{width:5px;cursor:col-resize;background:var(--border);transition:background .15s;flex-shrink:0}
.divider:hover,.divider.dragging{background:var(--accent)}

/* Sağ panel */
#right-panel{width:var(--rpanel-w);min-width:200px;max-width:500px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#canvas3d-container{flex:1;position:relative;overflow:hidden;background:#d4dde6;min-height:200px}
#canvas3d{display:block;width:100%;height:100%}
#view-btns{display:flex;gap:4px;padding:6px 8px;flex-wrap:wrap;background:var(--bg2);border-bottom:1px solid var(--border)}
.view-btn{padding:3px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px;background:var(--bg2);color:var(--fg2);cursor:pointer}
.view-btn:hover{background:var(--bg3)}
#props-panel{min-height:160px;max-height:340px;overflow-y:auto;padding:10px;border-top:1px solid var(--border)}
.props-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--fg3);margin-bottom:8px}
.prop-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.prop-row label{font-size:11px;color:var(--fg2);min-width:85px}
.prop-row input,.prop-row select{flex:1;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);font-size:12px}
.prop-row input[type=color]{flex:0 0 40px;height:28px;padding:2px;cursor:pointer}
.prop-row input[type=range]{padding:0}
.prop-row input:focus,.prop-row select:focus{outline:none;border-color:var(--accent)}
.prop-unit{font-size:11px;color:var(--fg3);min-width:24px}
.prop-info{font-size:11px;color:var(--fg3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}

/* Alt çubuk */
#statusbar{height:var(--statusbar-h);display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--bg2);border-top:1px solid var(--border);font-size:11px;color:var(--fg3)}
#statusbar span{white-space:nowrap}
.tip{flex:1;text-align:right;color:var(--fg3)}

/* Mod göstergesi */
#mode-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(37,99,235,.85);color:#fff;padding:4px 14px;border-radius:20px;font-size:12px;pointer-events:none;display:none;z-index:10}

/* Snap işareti */
#snap-ind{position:absolute;pointer-events:none;display:none;z-index:20}

/* Uzunluk girişi */
#len-wrap{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:50;display:none;align-items:center;gap:6px;background:var(--bg2);border:2px solid var(--accent);border-radius:8px;padding:6px 10px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
#len-in{padding:4px 8px;font-size:14px;border:none;background:transparent;color:var(--fg);width:120px;outline:none}
#len-unit{font-size:13px;color:var(--fg3)}

/* Kalibrasyon diyalog */
#cal-dialog{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.2);z-index:200;display:none;min-width:260px}
#cal-dialog h3{font-size:14px;margin-bottom:12px;color:var(--fg)}
#cal-dialog .row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
#cal-dialog input{flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);font-size:14px}
#cal-dialog input:focus{outline:none;border-color:var(--accent)}
#cal-dialog .btns{display:flex;gap:8px;justify-content:flex-end}


/* Yardım modalı */
#help-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:center}
#help-modal.open{display:flex}
#help-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px 28px;max-width:540px;width:90%;max-height:80vh;overflow-y:auto;position:relative}
#help-box h2{font-size:15px;margin-bottom:12px;color:var(--accent)}
#help-box table{width:100%;border-collapse:collapse;font-size:12px}
#help-box td{padding:4px 8px;border-bottom:1px solid var(--border)}
#help-box td:first-child{font-weight:600;white-space:nowrap;width:40%;color:var(--fg)}
#help-box td:last-child{color:var(--fg2)}
#help-close{position:absolute;top:10px;right:14px;font-size:18px;cursor:pointer;color:var(--fg3);background:none;border:none}
/* Rubber-band seçim */
#rubber-band{position:absolute;border:2px dashed #2563eb;background:rgba(37,99,235,.08);pointer-events:none;display:none}
/* Ölçü çizgisi */

/* Altlık slider */
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
</style>
</head>
<body>

<!-- ÜST ÇUBUK -->
<div id="toolbar">
  <span class="title">PLAN3D</span>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-new" title="Ctrl+N" aria-label="Yeni"><span class="icon">📄</span><span data-i18n="new">Yeni</span></button>
  <button class="tb-btn" id="btn-open" title="Ctrl+O" aria-label="Aç"><span class="icon">📂</span><span data-i18n="open">Aç</span></button>
  <button class="tb-btn" id="btn-save" title="Ctrl+S" aria-label="Kaydet"><span class="icon">💾</span><span data-i18n="save">Kaydet</span></button>
  <button class="tb-btn" id="btn-png" title="PNG" aria-label="PNG"><span class="icon">🖼️</span><span data-i18n="export_png">PNG</span></button>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-help" title="F1" aria-label="Yardım">❓</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-undo" title="Ctrl+Z" aria-label="Geri al"><span class="icon">↩</span><span data-i18n="undo">Geri al</span></button>
  <button class="tb-btn" id="btn-redo" title="Ctrl+Y" aria-label="Yinele"><span class="icon">↪</span><span data-i18n="redo">Yinele</span></button>
  <div class="spacer"></div>
  <label style="font-size:12px;color:var(--fg2);margin-right:4px" data-i18n="language">Dil</label>
  <select id="sel-lang"><option value="tr">Türkçe</option><option value="az">Azərbaycanca</option></select>
  <div class="sep"></div>
  <label style="font-size:12px;color:var(--fg2);margin-right:4px" data-i18n="unit">Birim</label>
  <select id="sel-unit">
    <option value="mm">mm</option><option value="cm" selected>cm</option>
    <option value="m">m</option><option value="km">km</option>
  </select>
</div>

<!-- ANA ALAN -->
<div id="main">
  <!-- Sol Panel -->
  <div id="left-panel">
    <div class="panel-section">
      <div class="panel-section-title" data-i18n="tools">Araçlar</div>
      <button class="tool-btn active" data-tool="select"><span class="icon">↖</span><span data-i18n="tool_select">Seç</span></button>
      <button class="tool-btn"        data-tool="wall"  ><span class="icon">📐</span><span data-i18n="tool_wall">Duvar</span></button>
      <button class="tool-btn"        data-tool="room"  ><span class="icon">⬜</span><span data-i18n="tool_room">Oda</span></button>
      <button class="tool-btn"        data-tool="measure"><span class="icon">📏</span><span data-i18n="tool_measure">Ölçü</span></button>
    </div>
    <div class="panel-section">
      <div class="panel-section-title" data-i18n="doors">Kapılar</div>
      <button class="tool-btn" data-tool="door-single" ><span class="icon">🚪</span><span data-i18n="door_single">Tek kanat</span></button>
      <button class="tool-btn" data-tool="door-double" ><span class="icon">🚪</span><span data-i18n="door_double">Çift kanat</span></button>
      <button class="tool-btn" data-tool="door-sliding"><span class="icon">🚪</span><span data-i18n="door_sliding">Sürgülü</span></button>
      <button class="tool-btn" data-tool="door-opening"><span class="icon">◻</span><span data-i18n="door_opening">Açık geçit</span></button>
    </div>
    <div class="panel-section">
      <div class="panel-section-title" data-i18n="windows">Pencereler</div>
      <button class="tool-btn" data-tool="win-std"    ><span class="icon">🪟</span><span data-i18n="win_std">Standart</span></button>
      <button class="tool-btn" data-tool="win-wide"   ><span class="icon">🪟</span><span data-i18n="win_wide">Geniş</span></button>
      <button class="tool-btn" data-tool="win-small"  ><span class="icon">🪟</span><span data-i18n="win_small">Küçük</span></button>
      <button class="tool-btn" data-tool="win-balcony"><span class="icon">🪟</span><span data-i18n="win_balcony">Balkon kapısı</span></button>
    </div>
    <div class="panel-section">
      <div class="panel-section-title" data-i18n="furniture">Mobilya</div>
      <button class="tool-btn" data-tool="furn-table"   ><span class="icon">🪑</span><span data-i18n="furn_table">Masa</span></button>
      <button class="tool-btn" data-tool="furn-chair"   ><span class="icon">🪑</span><span data-i18n="furn_chair">Sandalye</span></button>
      <button class="tool-btn" data-tool="furn-sofa"    ><span class="icon">🛋</span><span data-i18n="furn_sofa">Koltuk</span></button>
      <button class="tool-btn" data-tool="furn-bed"     ><span class="icon">🛏</span><span data-i18n="furn_bed">Yatak</span></button>
      <button class="tool-btn" data-tool="furn-wardrobe"><span class="icon">🗄</span><span data-i18n="furn_wardrobe">Dolap</span></button>
      <button class="tool-btn" data-tool="furn-sink"    ><span class="icon">🚿</span><span data-i18n="furn_sink">Lavabo</span></button>
      <button class="tool-btn" data-tool="furn-toilet"  ><span class="icon">🚽</span><span data-i18n="furn_toilet">Klozet</span></button>
      <button class="tool-btn" data-tool="furn-bath"    ><span class="icon">🛁</span><span data-i18n="furn_bath">Küvet</span></button>
      <button class="tool-btn" data-tool="furn-counter" ><span class="icon">🍳</span><span data-i18n="furn_counter">Tezgah</span></button>
    </div>

    <!-- ALTLIK BÖLÜMÜ -->
    <div class="panel-section" id="underlay-section">
      <div class="panel-section-title">
        <span data-i18n="underlay">Altlık</span>
        <button class="small-btn" id="btn-underlay-load" data-i18n="underlay_load">Yükle</button>
      </div>
      <div id="underlay-controls" style="display:none">
        <div class="prop-row" style="margin-top:4px">
          <label data-i18n="ul_opacity">Opaklık</label>
          <input type="range" id="ul-opacity" min="0" max="100" value="40" style="flex:1">
          <span id="ul-opacity-val" class="prop-unit">40%</span>
        </div>
        <label class="chk-row"><input type="checkbox" id="ul-visible" checked> <span data-i18n="ul_visible">Görünür</span></label>
        <label class="chk-row"><input type="checkbox" id="ul-lock">             <span data-i18n="ul_lock">Kilitle (taşıma)</span></label>
        <label class="chk-row"><input type="checkbox" id="ul-save" checked>     <span data-i18n="ul_save">Kayda dahil et</span></label>
        <div class="prop-row" style="margin-top:6px">
          <label data-i18n="ul_rotation">Döndür</label>
          <input type="number" id="ul-rot" value="0" min="-180" max="180" step="1" style="flex:1">
          <span class="prop-unit">°</span>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
          <button class="small-btn primary" id="btn-calibrate" data-i18n="ul_calibrate">Ölçeklendir</button>
          <button class="small-btn" id="btn-ul-move" data-i18n="ul_move">Taşı</button>
          <button class="small-btn danger" id="btn-ul-delete" data-i18n="ul_delete">Sil</button>
        </div>
        <div id="ul-status" style="font-size:11px;color:var(--fg3);margin-top:4px"></div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-section-title" data-i18n="view_opts">Görünüm</div>
      <label class="chk-row"><input type="checkbox" id="chk-grid"   checked> <span data-i18n="show_grid">Izgara</span></label>
      <label class="chk-row"><input type="checkbox" id="chk-labels" checked> <span data-i18n="show_labels">Etiketler</span></label>
      <label class="chk-row"><input type="checkbox" id="chk-snap"   checked> <span data-i18n="snap">Yapışma</span></label>
      <label class="chk-row"><input type="checkbox" id="chk-cut3d">          <span data-i18n="cut_section">Üst kesit (3B)</span></label>
    </div>
    <div class="panel-section">
      <div class="panel-section-title" data-i18n="defaults">Varsayılanlar</div>
      <div class="prop-row">
        <label data-i18n="def_height">Yükseklik</label>
        <input type="number" id="def-wall-height" value="270" min="50" max="1000">
        <span class="prop-unit">cm</span>
      </div>
      <div class="prop-row">
        <label data-i18n="def_thickness">Kalınlık</label>
        <input type="number" id="def-wall-thickness" value="20" min="5" max="100">
        <span class="prop-unit">cm</span>
      </div>
    </div>
    <div class="panel-section">
      <div class="panel-section-title" data-i18n="export_section">Dışa Aktar</div>
      <button class="small-btn primary" id="btn-export-html" style="width:100%;margin-top:4px" data-i18n="export_html">Etkileşimli HTML</button>
      <button class="small-btn" id="btn-export-glb" style="width:100%;margin-top:6px" data-i18n="export_glb">3B Model (GLB)</button>
      <button class="small-btn" id="btn-export-pdf" style="width:100%;margin-top:6px" data-i18n="export_pdf">PDF</button>
    </div>
  </div><!-- /left-panel -->

  <!-- 2B Canvas -->
  <div id="canvas-container">
    <canvas id="canvas2d"></canvas>
    <div id="mode-indicator"></div>
    <svg id="snap-ind" width="20" height="20" style="position:absolute;pointer-events:none">
      <rect x="2" y="2" width="16" height="16" fill="none" stroke="#f59e0b" stroke-width="2" rx="2"/>
    </svg>
    <div id="len-wrap">
      <input id="len-in" type="number" min="0" step="any" placeholder="uzunluk">
      <span id="len-unit">cm</span>
    </div>
    <!-- Kalibrasyon diyaloğu -->
    <div id="rubber-band"></div>
    <div id="cal-dialog">
      <h3 data-i18n="cal_title">Gerçek mesafeyi girin</h3>
      <div class="row">
        <input id="cal-in" type="number" min="0" step="any" placeholder="mesafe">
        <span id="cal-unit" style="font-size:13px;color:var(--fg3)">cm</span>
      </div>
      <div class="btns">
        <button class="small-btn" id="cal-cancel" data-i18n="cancel">İptal</button>
        <button class="small-btn primary" id="cal-ok" data-i18n="ok">Tamam</button>
      </div>
    </div>
  </div>

  <div class="divider" id="divider-right"></div>

  <!-- Sağ Panel -->
  <div id="right-panel">
    <div id="view-btns">
      <button class="view-btn" data-view="plan"   data-i18n="view_plan" title="Plan" aria-label="Plan">Plan</button>
      <button class="view-btn" data-view="iso"    data-i18n="view_iso" title="İzometrik" aria-label="İzometrik">İzometrik</button>
      <button class="view-btn" data-view="persp"  data-i18n="view_persp" title="Perspektif" aria-label="Perspektif">Perspektif</button>
      <button class="view-btn" data-view="side"   data-i18n="view_side" title="Yan" aria-label="Yan">Yan</button>
      <button class="view-btn" data-view="corner" data-i18n="view_corner" title="Köşe" aria-label="Köşe">Köşe</button>
      <button class="view-btn" id="btn-3dpng" aria-label="3B PNG indir"     data-i18n="export_3dpng">3B PNG</button>
      <label class="chk-row" style="margin-left:4px;font-size:11px"><input type="checkbox" id="chk-cut3d"> <span data-i18n="cut_section">Üst kesit</span></label>
    </div>
    <div id="canvas3d-container"><canvas id="canvas3d"></canvas></div>
    <div id="props-panel">
      <div class="props-title" data-i18n="properties">Özellikler</div>
      <div id="props-content" style="color:var(--fg3);font-size:12px" data-i18n="select_to_see">Bir nesne seçin</div>
    </div>
  </div>
</div><!-- /main -->

<!-- Alt çubuk -->
<div id="statusbar">
  <span id="sb-coords">x: 0, y: 0</span>
  <span id="sb-scale"></span>
  <span id="sb-tool"></span>
  <span class="tip" id="sb-tip"></span>
</div>


<!-- Yardım Modalı -->
<div id="help-modal">
  <div id="help-box">
    <button id="help-close" title="Kapat">✕</button>
    <h2 id="help-title">Kısayollar</h2>
    <p id="help-usage" style="font-size:12px;color:var(--fg2);margin-bottom:12px;line-height:1.5"></p>
    <table id="help-table"></table>
  </div>
</div>

<input type="file" id="file-open"     accept=".json,.plan3d.json" style="display:none">
<input type="file" id="file-underlay" accept="image/*,application/pdf" style="display:none">

<!-- Three.js r128 -->
<script src="three.min.js" onerror="loadThreeCDN()"></script>
<script>function loadThreeCDN(){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';document.head.appendChild(s)}</script>

<script>
'use strict';

/* ═══════════════════════════════════════
   I18N
═══════════════════════════════════════ */
const I18N={
  tr:{

let _idc=1;
function newId(p){return(p||'o')+(Date.now()%1000000)+(_idc++)}

function normalizeProject(p){
  if(!p) return p;
  p.walls=p.walls||[]; p.openings=p.openings||[]; p.rooms=p.rooms||[];
  p.furniture=p.furniture||[]; p.dimensions=p.dimensions||[];
  return p;

function selList(){
  if(APP.multiSel&&APP.multiSel.length) return APP.multiSel;
  return APP.selected?[APP.selected]:[];
}
function isSelItem(type,id){return selList().some(s=>s.type===type&&s.id===id)}
function setSel(items){
  APP.multiSel=items&&items.length?items.slice():[];
  APP.selected=APP.multiSel[0]||null;
}
function toggleSel(item,additive){
  if(!additive){setSel([item]);return}
  const list=selList().slice();
  const i=list.findIndex(s=>s.type===item.type&&s.id===item.id);
  if(i>=0) list.splice(i,1); else list.push(item);
  setSel(list);
}

/* ═══════════════════════════════════════
   SNAP
═══════════════════════════════════════ */
const SNAP_TOL_PX=14;
function findSnap(rx,ry){
  if(!APP.snapEnabled) return{x:rx,y:ry,type:'none'};
  if(APP.project){
    const tol=SNAP_TOL_PX/APP.zoom;
    let best=null,bestD=tol;
    for(const w of APP.project.walls){
      for(const pt of[
        {x:w.x1,y:w.y1,type:'endpoint'},
        {x:w.x2,y:w.y2,type:'endpoint'},
        {x:(w.x1+w.x2)/2,y:(w.y1+w.y2)/2,type:'midpoint'}
      ]){
        const d=Math.hypot(rx-pt.x,ry-pt.y);
        if(d<bestD){bestD=d;best=pt}
      }
    }
    if(best) return best;
  }
  const g=APP.gridSize;
  return{x:Math.round(rx/g)*g,y:Math.round(ry/g)*g,type:'grid'};
}
function applyAngleLock(x1,y1,x2,y2){
  if(!APP._shiftDown) return{x:x2,y:y2};
  const len=Math.hypot(x2-x1,y2-y1);
  const a=Math.round(Math.atan2(y2-y1,x2-x1)/(Math.PI/2))*(Math.PI/2);
  return{x:x1+len*Math.cos(a),y:y1+len*Math.sin(a)};
}

/* ═══════════════════════════════════════
   AÇIKLIK YARDIMCILARI & ÇAKIŞMA KONTROLÜ
═══════════════════════════════════════ */
function isOpeningTool(tool){return !!OPENING_PRESETS[tool]}

/**
 * Verilen duvarda pos konumunda wgen genişliğindeki açıklık geçerli mi?
 * excludeOpId: sürükleme/düzenlemede kendini hariç tut
 */
function validateOpeningPlacement(wall,pos,wgen,excludeOpId){
  const wLen=Math.hypot(wall.x2-wall.x1,wall.y2-wall.y1);
  const half=wgen/2;
  // Duvar sınırları kontrolü
  if(pos-half<0||pos+half>wLen) return{valid:false,reason:'bounds'};
  // Çakışma kontrolü
  const ops=APP.project.openings.filter(o=>o.wallId===wall.id&&o.id!==excludeOpId);
  for(const o of ops){
    const otherHalf=o.width/2;
    if(Math.abs(pos-o.pos)<(half+otherHalf-0.1)){
      return{valid:false,reason:'overlap'};
    }
  }
  return{valid:true};
}

/**
 * Bir duvar ve hedef pos verildiğinde, çakışmayacak en yakın geçerli pos'u bul
 */
function findBestOpeningPos(wall,targetPos,wgen,excludeOpId){
  const wLen=Math.hypot(wall.x2-wall.x1,wall.y2-wall.y1);
  const half=wgen/2;
  if(wLen<wgen) return null; // Duvar sığmaz
  let clamped=Math.max(half,Math.min(wLen-half,targetPos));
  if(validateOpeningPlacement(wall,clamped,wgen,excludeOpId).valid) return clamped;
  // Sağa ve sola kayarak en yakın boş yeri dene
  for(let offset=5;offset<=wLen;offset+=5){
    if(clamped+offset<=wLen-half&&validateOpeningPlacement(wall,clamped+offset,wgen,excludeOpId).valid) return clamped+offset;
    if(clamped-offset>=half&&validateOpeningPlacement(wall,clamped-offset,wgen,excludeOpId).valid) return clamped-offset;
  }
  return null;
}

const c2=document.getElementById('canvas2d');
const ctx=c2.getContext('2d');
function resizeCanvas(){
  const cont=document.getElementById('canvas-container');
  c2.width=cont.clientWidth; c2.height=cont.clientHeight; render2D();
}
function screenToCm(sx,sy){return{x:(sx-APP.pan.x)/APP.zoom,y:(sy-APP.pan.y)/APP.zoom}}
function cmToScreen(cx,cy){return{x:cx*APP.zoom+APP.pan.x,y:cy*APP.zoom+APP.pan.y}}

/* ── RENDER 2D ──────────────────────── */
function render2D(){
  const W=c2.width,H=c2.height;
  const p=APP.project;
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#f5f5f5';
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  if(APP.showGrid) drawGrid(W,H);
  if(!p) return;

  // Altlık – duvarların ALTINDA
  if(p.underlay&&p.underlay.visible&&p.underlay._img) drawUnderlay(p.underlay);

  p.rooms.forEach(r=>drawRoom(r));
  p.walls.forEach(w=>drawWall2D(w));
  p.openings.forEach(o=>drawOpening2D(o));
  p.furniture.forEach(f=>drawFurniture2D(f));

  if(APP.activeTool==='wall'&&APP.drawing) drawWallPreview();
  if(APP.activeTool==='room'&&APP.roomDraw) drawRoomPreview();
  if(isOpeningTool(APP.activeTool)&&APP.hoverOpening) drawOpeningPreview(APP.hoverOpening);
  if(selList().length) drawSelectionHandles();
  drawDimensions();
  if(APP.activeTool==='measure'&&APP.measurePts.length>0) drawMeasurePreview();
  if(APP.rubberBand){
    const r=APP.rubberBand;
    const x=Math.min(r.sx,r.x),y=Math.min(r.sy,r.y);
    const rw=Math.abs(r.x-r.sx),rh=Math.abs(r.y-r.sy);
    ctx.save(); ctx.fillStyle='rgba(37,99,235,.08)'; ctx.strokeStyle='#2563eb';
    ctx.setLineDash([5,3]); ctx.lineWidth=1.5;
    ctx.fillRect(x,y,rw,rh); ctx.strokeRect(x,y,rw,rh); ctx.restore();
  }

  // Kalibrasyon çizgisi
  if(APP.calState&&APP.calState.step===2){
    const p1=cmToScreen(APP.calState.cx1,APP.calState.cy1);
    const p2=cmToScreen(APP.mouse.cx,APP.mouse.cy);
    ctx.save(); ctx.setLineDash([6,4]); ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    [p1,p2].forEach(pt=>{ctx.beginPath();ctx.arc(pt.x,pt.y,5,0,Math.PI*2);ctx.fillStyle='#f59e0b';ctx.fill()});
    ctx.restore();
  }
}

/* ── Izgara ──────────────────────── */
function drawGrid(W,H){
  const gpx=APP.gridSize*APP.zoom;
  if(gpx<4) return;
  const sx=((APP.pan.x%gpx)+gpx)%gpx,sy=((APP.pan.y%gpx)+gpx)%gpx;
  const border=getComputedStyle(document.documentElement).getPropertyValue('--border').trim()||'#d0d0d0';
  ctx.strokeStyle=border; ctx.lineWidth=.5; ctx.globalAlpha=.55;
  ctx.beginPath();
  for(let x=sx;x<W;x+=gpx){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=sy;y<H;y+=gpx){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke(); ctx.globalAlpha=1;
  if(gpx*10>20){
    const bp=gpx*10,bx=((APP.pan.x%bp)+bp)%bp,by=((APP.pan.y%bp)+bp)%bp;
    ctx.strokeStyle='#a0a0b0'; ctx.lineWidth=.9; ctx.globalAlpha=.4;
    ctx.beginPath();
    for(let x=bx;x<W;x+=bp){ctx.moveTo(x,0);ctx.lineTo(x,H)}
    for(let y=by;y<H;y+=bp){ctx.moveTo(0,y);ctx.lineTo(W,y)}
    ctx.stroke(); ctx.globalAlpha=1;
  }
}

/* ── Duvar köşe uzatma ───────────── */
function wallExtensions(w){
  let ext1=0,ext2=0;
  if(!APP.project) return{ext1,ext2};
  const snap=5;
  for(const o of APP.project.walls){
    if(o.id===w.id) continue;
    for(const op of[{x:o.x1,y:o.y1},{x:o.x2,y:o.y2}]){
      if(Math.hypot(w.x1-op.x,w.y1-op.y)<snap) ext1=Math.max(ext1,o.thickness/2);
      if(Math.hypot(w.x2-op.x,w.y2-op.y)<snap) ext2=Math.max(ext2,o.thickness/2);
    }
  }
  return{ext1,ext2};
}

/* ── Duvar ───────────────────────── */
function drawWall2D(w){
  const dx=w.x2-w.x1,dy=w.y2-w.y1,len=Math.hypot(dx,dy)||1;
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  const th=w.thickness||20,half=th/2;
  const{ext1,ext2}=wallExtensions(w);
  const ax1=w.x1-ux*ext1,ay1=w.y1-uy*ext1;
  const ax2=w.x2+ux*ext2,ay2=w.y2+uy*ext2;
  const corners=[
    cmToScreen(ax1+nx*half,ay1+ny*half),cmToScreen(ax2+nx*half,ay2+ny*half),
    cmToScreen(ax2-nx*half,ay2-ny*half),cmToScreen(ax1-nx*half,ay1-ny*half),
  ];
  const isSel=isSelItem('wall',w.id);
  ctx.beginPath();
  ctx.moveTo(corners[0].x,corners[0].y);
  corners.forEach(c=>ctx.lineTo(c.x,c.y));
  ctx.closePath();
  ctx.fillStyle=w.color||'#f4efe6';
  ctx.strokeStyle=isSel?'#2563eb':'#555';
  ctx.lineWidth=isSel?2:1;
  ctx.fill(); ctx.stroke();
  if(APP.showLabels&&APP.zoom>0.25){
    const mx=(w.x1+w.x2)/2,my=(w.y1+w.y2)/2;
    const sp=cmToScreen(mx,my);
    const angle=Math.atan2(dy,dx),halfPx=half*APP.zoom;
    const label=`${toDisplay(len)} ${unitLabel()}`;
    ctx.save();
    ctx.translate(sp.x,sp.y); ctx.rotate(angle);
    const fs=Math.max(9,Math.min(13,APP.zoom*12));
    ctx.font=`${fs}px sans-serif`; ctx.fillStyle='#444';
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(label,0,-halfPx-2);
    ctx.restore();
  }
}

/* ── Oda Önizleme (çizim esnasında) ── */
function drawRoomPreview(){
  const rd=APP.roomDraw;if(!rd||rd.points.length===0) return;
  const pts=rd.points;
  ctx.save();
  // Çizilen noktalar arası çizgiler
  ctx.strokeStyle='#16a34a'; ctx.lineWidth=2; ctx.setLineDash([6,3]);
  ctx.beginPath();
  const p0=cmToScreen(pts[0][0],pts[0][1]); ctx.moveTo(p0.x,p0.y);
  for(let i=1;i<pts.length;i++){const p=cmToScreen(pts[i][0],pts[i][1]);ctx.lineTo(p.x,p.y)}
  // Mevcut fare konumuna çizgi
  ctx.lineTo(APP.mouse.cx*APP.zoom+APP.pan.x,APP.mouse.cy*APP.zoom+APP.pan.y);
  ctx.stroke(); ctx.setLineDash([]);
  // Köşe noktaları
  pts.forEach((pt,i)=>{
    const sp=cmToScreen(pt[0],pt[1]);
    ctx.beginPath(); ctx.arc(sp.x,sp.y,i===0?7:4,0,Math.PI*2);
    ctx.fillStyle=i===0?'#16a34a':'#4ade80'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  });
  // Kapanma ipucu (ilk noktaya yakınsa)
  if(pts.length>=3){
    const sp=cmToScreen(APP.mouse.cx,APP.mouse.cy);
    const fp=cmToScreen(pts[0][0],pts[0][1]);
    if(Math.hypot(sp.x-fp.x,sp.y-fp.y)<20){
      ctx.beginPath(); ctx.arc(fp.x,fp.y,10,0,Math.PI*2);
      ctx.strokeStyle='#16a34a'; ctx.lineWidth=2.5; ctx.stroke();
    }
  }
  ctx.restore();
}

/* ── Duvar önizleme ──────────────── */
function drawWallPreview(){
  const s=APP.drawing;
  const locked=applyAngleLock(s.x1,s.y1,APP.mouse.cx,APP.mouse.cy);
  const p1=cmToScreen(s.x1,s.y1),p2=cmToScreen(locked.x,locked.y);

  const dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len,half=th/2;
  ctx.save(); ctx.globalAlpha=.55;
  ctx.beginPath();
  ctx.moveTo(p1.x+nx*half,p1.y+ny*half); ctx.lineTo(p2.x+nx*half,p2.y+ny*half);
  ctx.lineTo(p2.x-nx*half,p2.y-ny*half); ctx.lineTo(p1.x-nx*half,p1.y-ny*half);
  ctx.closePath(); ctx.fillStyle='#c8d8ff'; ctx.strokeStyle='#2563eb'; ctx.lineWidth=1.5;
  ctx.fill(); ctx.stroke(); ctx.restore();
  const lenCm=Math.hypot(locked.x-s.x1,locked.y-s.y1);
  const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
  const label=`${toDisplay(lenCm)} ${unitLabel()}`;

  ctx.font='bold 12px sans-serif';
  const tw=ctx.measureText(label).width;

  ctx.fillText(label,mx,my-16);
  ctx.restore();
  ctx.beginPath(); ctx.arc(p1.x,p1.y,5,0,Math.PI*2);
  ctx.fillStyle='#2563eb'; ctx.fill();
}

/* ── 2B Açıklık Çizimi (Mimari Semboller) ── */
function drawOpening2D(o){
  const wall=APP.project.walls.find(w=>w.id===o.wallId);if(!wall) return;
  const dx=wall.x2-wall.x1,dy=wall.y2-wall.y1,wLen=Math.hypot(dx,dy);if(wLen<1) return;
  const ux=dx/wLen,uy=dy/wLen,nx=-uy,ny=ux;
  const half=o.width/2,th=wall.thickness||20,halfTh=th/2;
  const cx=wall.x1+ux*o.pos,cy=wall.y1+uy*o.pos;

  // Duvar delik alanı noktaları
  const p1=cmToScreen(cx-ux*half,cy-uy*half);
  const p2=cmToScreen(cx+ux*half,cy+uy*half);
  const halfPx=halfTh*APP.zoom;
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#f5f5f5';

  // 1. Duvarda delik aç (arka planla doldur)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p1.x+nx*halfPx,p1.y+ny*halfPx); ctx.lineTo(p2.x+nx*halfPx,p2.y+ny*halfPx);
  ctx.lineTo(p2.x-nx*halfPx,p2.y-ny*halfPx); ctx.lineTo(p1.x-nx*halfPx,p1.y-ny*halfPx);
  ctx.closePath();
  ctx.fillStyle=bg; ctx.fill();

  // Seçili ise vurgula
  const isSel=isSelItem('opening',o.id);
  if(isSel){
    ctx.strokeStyle='#2563eb'; ctx.lineWidth=2;
    ctx.stroke();
  }

  // 2. Kasa/yan pervaz çizgileri
  ctx.strokeStyle=isSel?'#2563eb':'#444';
  ctx.lineWidth=isSel?2:1.2;
  ctx.beginPath();
  ctx.moveTo(p1.x+nx*halfPx,p1.y+ny*halfPx); ctx.lineTo(p1.x-nx*halfPx,p1.y-nx*halfPx);
  ctx.moveTo(p2.x+nx*halfPx,p2.y+ny*halfPx); ctx.lineTo(p2.x-nx*halfPx,p2.y-nx*halfPx);
  ctx.stroke();

  // 3. Tipe göre mimari sembol
  const isDoor=o.type.startsWith('door');
  const isWindow=o.type.startsWith('win');

  if(isWindow){
    // Pencere: çift veya üç cam çizgisi + denizlik
    const c1=cmToScreen(cx-ux*half,cy-uy*half);
    const c2s=cmToScreen(cx+ux*half,cy+uy*half);
    // Orta cam çizgisi
    ctx.strokeStyle=isSel?'#2563eb':'#0284c7';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(c1.x,c1.y); ctx.lineTo(c2s.x,c2s.y);
    ctx.stroke();
    // İç ve dış pervaz çizgileri
    ctx.strokeStyle=isSel?'#2563eb':'#777';
    ctx.lineWidth=1;
    const off=halfPx*0.5;
    ctx.beginPath();
    ctx.moveTo(c1.x+nx*off,c1.y+ny*off); ctx.lineTo(c2s.x+nx*off,c2s.y+ny*off);
    ctx.moveTo(c1.x-nx*off,c1.y-ny*off); ctx.lineTo(c2s.x-nx*off,c2s.y-ny*off);
    ctx.stroke();
    // Balkon kapısı ise açılma kanadı da ekle
    if(o.type==='win-balcony'){
      drawDoorSwing(cx,cy,ux,uy,nx,ny,half,o.flip,o.swing,isSel);
    }
  } else if(isDoor){
    if(o.type==='door-opening'){
      // Açık geçit: kesikli sınır çizgileri
      ctx.setLineDash([4,3]); ctx.strokeStyle='#888'; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(p1.x+nx*halfPx,p1.y+ny*halfPx); ctx.lineTo(p2.x+nx*halfPx,p2.y+ny*halfPx);
      ctx.moveTo(p1.x-nx*halfPx,p1.y-ny*halfPx); ctx.lineTo(p2.x-nx*halfPx,p2.y-ny*halfPx);
      ctx.stroke();
      ctx.setLineDash([]);
    } else if(o.type==='door-sliding'){
      // Sürgülü kapı: iki paralel kayan kanat çizgisi
      ctx.strokeStyle=isSel?'#2563eb':'#854d0e'; ctx.lineWidth=2.5;
      const q=half*0.5;
      const s1=cmToScreen(cx-ux*half,cy-uy*half+nx*2);
      const s2=cmToScreen(cx+ux*2,cy+uy*2+nx*2);
      const s3=cmToScreen(cx-ux*2,cy-uy*2-nx*2);
      const s4=cmToScreen(cx+ux*half,cy+uy*half-nx*2);
      ctx.beginPath();
      ctx.moveTo(s1.x,s1.y); ctx.lineTo(s2.x,s2.y);
      ctx.moveTo(s3.x,s3.y); ctx.lineTo(s4.x,s4.y);
      ctx.stroke();
    } else if(o.type==='door-double'){
      // Çift kanat kapı: iki menteşe ve iki yay
      drawDoubleDoorSwing(cx,cy,ux,uy,nx,ny,half,o.swing,isSel);
    } else {
      // Tek kanat kapı (standart): kanat + açılma yayı
      drawDoorSwing(cx,cy,ux,uy,nx,ny,half*2,o.flip,o.swing,isSel);
    }
  }

  // Ölçü etiketi (seçili veya yakınlaştırılmışsa)
  if(APP.showLabels&&APP.zoom>0.35){
    const sp=cmToScreen(cx,cy);
    ctx.font='10px sans-serif'; ctx.fillStyle='#666'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const dimStr=`${Math.round(o.width)}×${Math.round(o.height)}`;
    ctx.fillText(dimStr,sp.x,sp.y);
  }

  ctx.restore();
}

/** Tek kanat açılma sembolü */
function drawDoorSwing(cx,cy,ux,uy,nx,ny,doorWidth,flip,swing,isSel){
  const sign=(swing==='out'?-1:1);
  const sideSign=flip?1:-1; // menteşe sol mu sağ mı
  const hx=cx+ux*(doorWidth/2)*sideSign;
  const hy=cy+uy*(doorWidth/2)*sideSign;
  const hp=cmToScreen(hx,hy);
  const wPx=doorWidth*APP.zoom;

  // Kapı kanadı yönü: menteşeden dik olarak dışarı/içeri
  const kx=nx*sign*(-sideSign);
  const ky=ny*sign*(-sideSign);
  const ep=cmToScreen(hx+kx*doorWidth,hy+ky*doorWidth);

  // Kanat çizgisi
  ctx.strokeStyle=isSel?'#2563eb':'#854d0e';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(hp.x,hp.y); ctx.lineTo(ep.x,ep.y);
  ctx.stroke();

  // Açılma yayı
  ctx.save();
  ctx.setLineDash([3,3]);
  ctx.strokeStyle=isSel?'#2563eb':'#a16207';
  ctx.lineWidth=1;
  const aClosed=Math.atan2(-sideSign*uy,-sideSign*ux);
  const aOpen=Math.atan2(ky,kx);
  ctx.beginPath();
  ctx.arc(hp.x,hp.y,wPx,aClosed,aOpen,sideSign*sign>0);
  ctx.stroke();
  ctx.restore();
}

/** Çift kanat açılma sembolü */
function drawDoubleDoorSwing(cx,cy,ux,uy,nx,ny,halfWidth,swing,isSel){
  const sign=(swing==='out'?-1:1);
  // Sol kanat
  drawDoorSwing(cx-ux*halfWidth/2,cy-uy*halfWidth/2,ux,uy,nx,ny,halfWidth,false,swing,isSel);
  // Sağ kanat
  drawDoorSwing(cx+ux*halfWidth/2,cy+uy*halfWidth/2,ux,uy,nx,ny,halfWidth,true,swing,isSel);
}

/* ── Açıklık Önizlemesi (yerleştirme esnasında) ── */
function drawOpeningPreview(hover){

  ctx.lineTo(p2.x-nx*halfPx,p2.y-ny*halfPx); ctx.lineTo(p1.x-nx*halfPx,p1.y-ny*halfPx);

/* ── Oda ────────────────────────────── */
function polyArea(pts){
  // Shoelace formula – returns area in cm²
  let a=0;const n=pts.length;
  for(let i=0;i<n;i++){const j=(i+1)%n;a+=pts[i][0]*pts[j][1]-pts[j][0]*pts[i][1]}
  return Math.abs(a)/2;
}
function polyBBox(pts){
  let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity;
  pts.forEach(p=>{mnX=Math.min(mnX,p[0]);mnY=Math.min(mnY,p[1]);mxX=Math.max(mxX,p[0]);mxY=Math.max(mxY,p[1])});
  return{minX:mnX,minY:mnY,maxX:mxX,maxY:mxY,w:mxX-mnX,h:mxY-mnY};
}
function isPointInPolygon(px,py,pts){
  let inside=false;const n=pts.length;
  for(let i=0,j=n-1;i<n;j=i++){
    const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

function drawRoom(r){
  if(!r.points||r.points.length<3) return;
  const isSel=isSelItem('room',r.id);
  ctx.save(); ctx.beginPath();
  const p0=cmToScreen(r.points[0][0],r.points[0][1]); ctx.moveTo(p0.x,p0.y);
  for(let i=1;i<r.points.length;i++){const p=cmToScreen(r.points[i][0],r.points[i][1]);ctx.lineTo(p.x,p.y)}
  ctx.closePath();
  ctx.fillStyle=r.floor||'rgba(200,220,200,0.25)'; ctx.fill();
  if(isSel){ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.setLineDash([6,3]);ctx.stroke();ctx.setLineDash([])}

  if(APP.showLabels&&r.showLabel!==false){
    const bb=polyBBox(r.points);
    const mx=(bb.minX+bb.maxX)/2,my=(bb.minY+bb.maxY)/2;
    const sp=cmToScreen(mx,my);
    const area_cm2=polyArea(r.points); // cm²
    const area_m2=(area_cm2/10000).toFixed(1).replace('.',',');

    // Bounding box ölçüleri
    const isRectish=(r.points.length<=6); // basit heuristic
    const dimStr=isRectish
      ?`${r.name?r.name.toUpperCase():'ODA'} ${toDisplay(bb.w)} × ${toDisplay(bb.h)} ${unitLabel()}`
      :`${r.name?r.name.toUpperCase():'ODA'}`;

    const areaStr=`${area_m2} m²`;

    const fs=Math.max(9,Math.min(16,APP.zoom*14));
    ctx.font=`bold ${fs}px sans-serif`;
    ctx.fillStyle='#334155'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(dimStr,sp.x,sp.y-(fs*0.65));
    ctx.font=`${Math.max(8,fs*0.85)}px sans-serif`;
    ctx.fillStyle='#64748b';
    ctx.fillText(areaStr,sp.x,sp.y+(fs*0.6));
  }
  ctx.restore();
}

/* ── Mobilya ────────────────────────── */
function drawFurniture2D(f){
  const sp=cmToScreen(f.x,f.y);
  const isSel=isSelItem('furniture',f.id);
  ctx.save();
  ctx.translate(sp.x,sp.y); ctx.rotate((f.rot||0)*Math.PI/180);
  const W=f.w*APP.zoom,D=f.d*APP.zoom;
  ctx.fillStyle=f.color||'#a5754b';
  ctx.strokeStyle=isSel?'#2563eb':'#555';
  ctx.lineWidth=isSel?2:1;
  ctx.fillRect(-W/2,-D/2,W,D);
  ctx.strokeRect(-W/2,-D/2,W,D);

  // Tipe özgü simge
  ctx.strokeStyle=isSel?'#1d4ed8':'#333'; ctx.lineWidth=1;
  const t=f.type;
  if(t==='toilet'){
    // Klozet: oval + arka tank
    ctx.beginPath(); ctx.ellipse(0,D*0.1,W*0.4,D*0.38,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeRect(-W*0.45,-D/2,W*0.9,D*0.25);
  } else if(t==='sink'){
    // Lavabo: içte küçük oval
    ctx.beginPath(); ctx.ellipse(0,0,W*0.35,D*0.35,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,W*0.08,0,Math.PI*2); ctx.stroke();
  } else if(t==='bath'){
    // Küvet: içte küçük oval
    ctx.beginPath(); ctx.ellipse(0,D*0.08,W*0.38,D*0.35,0,0,Math.PI*2); ctx.stroke();
  } else if(t==='bed'){
    // Yatak: yastık + yorgan çizgisi
    ctx.strokeRect(-W/2,-D/2,W,D*0.3);
    ctx.beginPath(); ctx.moveTo(-W/2,D*0.1); ctx.lineTo(W/2,D*0.1); ctx.stroke();
  } else if(t==='sofa'){
    // Koltuk: arka ve kol dayama
    ctx.strokeRect(-W/2,-D/2,W,D*0.6);
    ctx.strokeRect(-W/2,-D/2,W*0.15,D);
    ctx.strokeRect(W/2-W*0.15,-D/2,W*0.15,D);
  } else if(t==='table'){
    // Masa: çapraz köşegen
    ctx.beginPath();
    ctx.moveTo(-W/2,-D/2); ctx.lineTo(W/2,D/2);
    ctx.moveTo(W/2,-D/2); ctx.lineTo(-W/2,D/2);
    ctx.stroke();
  }

  if(APP.showLabels&&APP.zoom>0.4){
    const fs=Math.max(8,Math.min(11,APP.zoom*10));
    ctx.font=`${fs}px sans-serif`; ctx.fillStyle='#1e293b';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(f.type,0,0);
  }
  ctx.restore();
}

/* ── Altlık ─────────────────────────── */
function drawUnderlay(u){
  if(!u._img) return;
  const sp=cmToScreen(u.x,u.y);
  ctx.save();
  ctx.globalAlpha=u.opacity!==undefined?u.opacity:0.4;
  ctx.translate(sp.x,sp.y);
  if(u.rotation) ctx.rotate(u.rotation*Math.PI/180);
  ctx.drawImage(u._img,0,0,u._img.width*(u.scale||1)*APP.zoom,u._img.height*(u.scale||1)*APP.zoom);
  if(APP.activeTool==='underlay-move'){
    const W=u._img.width*(u.scale||1)*APP.zoom,H=u._img.height*(u.scale||1)*APP.zoom;
    ctx.globalAlpha=1; ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2;
    ctx.setLineDash([8,4]); ctx.strokeRect(0,0,W,H);
  }
  ctx.restore();
}

/* ── Seçim tutamaçları ──────────────── */
function drawSelectionHandles(){
  selList().forEach(s=>{
    if(s.type==='wall'){
      const w=APP.project.walls.find(x=>x.id===s.id);if(!w) return;
      [{x:w.x1,y:w.y1},{x:w.x2,y:w.y2}].forEach(pt=>{
        const sp=cmToScreen(pt.x,pt.y);
        ctx.beginPath(); ctx.arc(sp.x,sp.y,6,0,Math.PI*2);
        ctx.fillStyle='#fff'; ctx.strokeStyle='#2563eb'; ctx.lineWidth=2;
        ctx.fill(); ctx.stroke();
      });
    } else if(s.type==='opening'){
      const o=APP.project.openings.find(x=>x.id===s.id);if(!o) return;
      const w=APP.project.walls.find(x=>x.id===o.wallId);if(!w) return;
      const dx=w.x2-w.x1,dy=w.y2-w.y1,l=Math.hypot(dx,dy)||1;
      const ux=dx/l,uy=dy/l;
      const cx=w.x1+ux*o.pos,cy=w.y1+uy*o.pos;
      const sp=cmToScreen(cx,cy);
      ctx.beginPath(); ctx.arc(sp.x,sp.y,5,0,Math.PI*2);
      ctx.fillStyle='#2563eb'; ctx.fill();
    }
  });
}

/* ── Snap işareti ───────────────────── */
function updateSnapIndicator(snap){
  const ind=document.getElementById('snap-ind');
  if(snap.type==='endpoint'||snap.type==='midpoint'){
    const sp=cmToScreen(snap.x,snap.y);
    ind.style.display='block'; ind.style.left=(sp.x-10)+'px'; ind.style.top=(sp.y-10)+'px';
    ind.querySelector('rect').setAttribute('stroke',snap.type==='endpoint'?'#f59e0b':'#10b981');
    ind.querySelector('rect').setAttribute('rx',snap.type==='midpoint'?'10':'2');
  } else { ind.style.display='none'; }
}


/* ── Ölçü Çizgisi ─────────────────── */
function drawDimensions(){
  if(!APP.project||!APP.project.dimensions) return;
  APP.project.dimensions.forEach(d=>{
    const p1=cmToScreen(d.x1,d.y1),p2=cmToScreen(d.x2,d.y2);
    const len=Math.hypot(d.x2-d.x1,d.y2-d.y1);
    const label=`${toDisplay(len)} ${unitLabel()}`;
    const angle=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    ctx.save();
    const dimSel=isSelItem('dimension',d.id);
    ctx.strokeStyle=dimSel?'#2563eb':'#f59e0b'; ctx.lineWidth=dimSel?2.5:1.5; ctx.setLineDash([5,3]);
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    ctx.setLineDash([]);
    // Ok uçları
    [p1,p2].forEach((pt,i)=>{
      ctx.save(); ctx.translate(pt.x,pt.y); ctx.rotate(angle+(i===1?0:Math.PI));
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-10,-5); ctx.lineTo(-10,5); ctx.closePath();
      ctx.fillStyle='#f59e0b'; ctx.fill(); ctx.restore();
    });
    // Etiket
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    ctx.font='bold 11px sans-serif';
    const tw=ctx.measureText(label).width;
    ctx.fillStyle='rgba(255,255,200,.9)'; ctx.fillRect(mx-tw/2-4,my-18,tw+8,16);
    ctx.fillStyle='#92400e'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,mx,my-10);
    ctx.restore();
  });
}
function drawMeasurePreview(){
  const pts=APP.measurePts;
  const p1=cmToScreen(pts[0].x,pts[0].y);
  const p2=cmToScreen(APP.mouse.cx,APP.mouse.cy);
  const lenCm=Math.hypot(APP.mouse.cx-pts[0].x,APP.mouse.cy-pts[0].y);
  ctx.save();
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1.5; ctx.setLineDash([5,3]);
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(p1.x,p1.y,4,0,Math.PI*2);
  ctx.fillStyle='#f59e0b'; ctx.fill();
  const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
  const label=`${toDisplay(lenCm)} ${unitLabel()}`;
  ctx.font='bold 11px sans-serif';
  const tw=ctx.measureText(label).width;
  ctx.fillStyle='rgba(255,255,200,.9)'; ctx.fillRect(mx-tw/2-4,my-18,tw+8,16);
  ctx.fillStyle='#92400e'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,mx,my-10);
  ctx.restore();
}

/* ═══════════════════════════════════════
   MOUSE
═══════════════════════════════════════ */
c2.addEventListener('pointermove',onMM);
c2.addEventListener('pointerdown',onMD);
c2.addEventListener('pointerup',  onMU);
c2.addEventListener('pointercancel',onMU);
c2.addEventListener('wheel',    onMW,{passive:false});
c2.addEventListener('contextmenu',e=>e.preventDefault());
c2.addEventListener('dblclick', onDbl);

function getPos(e){const r=c2.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

function onMM(e){
  const pos=getPos(e);
  APP.mouse.x=pos.x; APP.mouse.y=pos.y;

  if(APP.panning&&APP.panStart){
    APP.pan.x+=pos.x-APP.panStart.x; APP.pan.y+=pos.y-APP.panStart.y;
    APP.panStart=pos; render2D(); updateStatusBar(); return;
  }
  if(APP.rubberBand){
    APP.rubberBand.x=pos.x; APP.rubberBand.y=pos.y;
    render2D(); updateStatusBar(); return;
  }

  const raw=screenToCm(pos.x,pos.y);
  APP.mouseRaw.cx=raw.x; APP.mouseRaw.cy=raw.y;
  const snap=findSnap(raw.x,raw.y);
  APP.mouse.cx=snap.x; APP.mouse.cy=snap.y;
  updateSnapIndicator(snap);

  // Açıklık aracı aktifken duvar üzerine gelme algılama
  if(isOpeningTool(APP.activeTool)){
    updateOpeningHover(raw.x,raw.y);
    render2D(); updateStatusBar(); return;
  }

  // Seçim modu sürükleme (duvar veya açıklık)
  if(APP.drag&&APP.activeTool==='select'){
    const d=APP.drag;
    if(d.type==='opening'){
      const o=APP.project.openings.find(x=>x.id===d.opId);
      const w=APP.project.walls.find(x=>x.id===d.wallId);
      if(o&&w){
        const dx=w.x2-w.x1,dy=w.y2-w.y1,l=Math.hypot(dx,dy)||1;
        const ux=dx/l,uy=dy/l;
        // Fareyi duvar çizgisine izdüşür
        const rawPos=(raw.x-w.x1)*ux+(raw.y-w.y1)*uy;
        const bestPos=findBestOpeningPos(w,rawPos,o.width,o.id);
        if(bestPos!==null&&Math.abs(bestPos-o.pos)>0.1){
          APP._dragMoved=true;
          o.pos=bestPos;
          updatePropsPanel();
          render2D();
        }
      }
    } else {
      const dcx=snap.x-d.lastCx,dcy=snap.y-d.lastCy;
      if(Math.hypot(dcx,dcy)>0.01){
        APP._dragMoved=true;
        if(d.type==='multi'){
          moveSelection(dcx,dcy);
          d.lastCx=snap.x; d.lastCy=snap.y;
          render2D();
        } else if(d.type==='furniture'){
          const f=APP.project.furniture.find(x=>x.id===d.furnId);
          if(f){f.x+=dcx;f.y+=dcy;d.lastCx=snap.x;d.lastCy=snap.y;render2D();}
        } else {
          const w=APP.project.walls.find(x=>x.id===d.wallId);
          if(w){
            if(d.type==='wall-body'){w.x1+=dcx;w.y1+=dcy;w.x2+=dcx;w.y2+=dcy}
            else if(d.type==='ep1'){w.x1+=dcx;w.y1+=dcy}
            else if(d.type==='ep2'){w.x2+=dcx;w.y2+=dcy}
            d.lastCx=snap.x; d.lastCy=snap.y;
            render2D();
          }
        }
      }
    }
    updateStatusBar(); return;
  }

  // Altlık sürükleme
  if(APP.ulDrag&&APP.activeTool==='underlay-move'){
    const u=APP.project.underlay;
    if(u&&!u.locked){
      u.x+=raw.x-APP.ulDrag.lastCx; u.y+=raw.y-APP.ulDrag.lastCy;
      APP.ulDrag.lastCx=raw.x; APP.ulDrag.lastCy=raw.y;
      render2D();
    }
    return;
  }

  updateStatusBar();
  if(APP.activeTool==='wall'&&APP.drawing) render2D();
  if(APP.activeTool==='room'&&APP.roomDraw&&APP.roomDraw.points.length>0) render2D();
  if(APP.activeTool==='measure'&&APP.measurePts.length>0) render2D();
  if(APP.calState&&APP.calState.step===2) render2D();
}

function updateOpeningHover(rawCx,rawCy){
  APP.hoverOpening=null;
  if(!APP.project||APP.project.walls.length===0) return;
  const preset=OPENING_PRESETS[APP.activeTool];if(!preset) return;

  // En yakın duvarı bul
  let bestWall=null,bestDist=Infinity,bestProj=0;
  for(const w of APP.project.walls){
    const dx=w.x2-w.x1,dy=w.y2-w.y1,l=Math.hypot(dx,dy);if(l<1) continue;
    const dist=ptSegDist(rawCx,rawCy,w.x1,w.y1,w.x2,w.y2);
    const tol=(w.thickness/2)+25; // 25cm yakalama payı
    if(dist<tol&&dist<bestDist){
      bestDist=dist; bestWall=w;
      const ux=dx/l,uy=dy/l;
      bestProj=(rawCx-w.x1)*ux+(rawCy-w.y1)*uy;
    }
  }

  if(bestWall){
    const bestPos=findBestOpeningPos(bestWall,bestProj,preset.width,null);
    if(bestPos!==null){
      APP.hoverOpening={
        wall:bestWall,pos:bestPos,preset,tool:APP.activeTool,valid:true
      };
    } else {
      // Duvara sığmıyor
      const wLen=Math.hypot(bestWall.x2-bestWall.x1,bestWall.y2-bestWall.y1);
      APP.hoverOpening={
        wall:bestWall,pos:wLen/2,preset,tool:APP.activeTool,valid:false
      };
    }
  }
}

function onMD(e){
  const pos=getPos(e);

  if(e.button===1||e.button===2||(e.button===0&&APP._spaceDown)){
    APP.panning=true; APP.panStart=pos; c2.style.cursor='grab';
    try{c2.setPointerCapture(e.pointerId)}catch(_){}
    return;
  }
  if(e.button!==0) return;
  try{c2.setPointerCapture(e.pointerId)}catch(_){}

  // Açıklık aracıyla duvara bırakma
  if(isOpeningTool(APP.activeTool)){
    if(APP.hoverOpening&&APP.hoverOpening.valid){
      const{wall,pos:openPos,preset,tool}=APP.hoverOpening;
      const op={
        id:newId('op'),
        wallId:wall.id,
        type:tool,
        pos:openPos,
        width:preset.width,
        height:preset.height,
        sill:preset.sill,
        flip:false,
        swing:preset.swing||'in'
      };
      historySave();
      APP.project.openings.push(op);
      setSel([{type:'opening',id:op.id}]);
      APP.hoverOpening=null;
      setActiveTool('select');
      updatePropsPanel();
      render2D(); render3D();
    }
    return;
  }

  // Kalibrasyon modu
  if(APP.activeTool==='calibrate'){
    if(!APP.calState||APP.calState.step===1){
      APP.calState={step:2,cx1:APP.mouse.cx,cy1:APP.mouse.cy};
      setModeIndicator(t('cal_step2')); render2D();
    } else if(APP.calState.step===2){
      showCalDialog(APP.calState.cx1,APP.calState.cy1,APP.mouse.cx,APP.mouse.cy);
    }
    return;
  }

  // Altlık taşıma
  if(APP.activeTool==='underlay-move'){
    const u=APP.project&&APP.project.underlay;
    if(u&&!u.locked){APP.ulDrag={lastCx:APP.mouseRaw.cx,lastCy:APP.mouseRaw.cy}}
    return;
  }

  // Oda aracı
  if(APP.activeTool==='room'){
    if(!APP.roomDraw) APP.roomDraw={points:[]};
    const snap=findSnap(APP.mouseRaw.cx,APP.mouseRaw.cy);
    const pt=[snap.x,snap.y];
    // İlk noktaya kapanma
    const pts=APP.roomDraw.points;
    if(pts.length>=3){
      const fp=cmToScreen(pts[0][0],pts[0][1]);
      const mp=cmToScreen(snap.x,snap.y);
      if(Math.hypot(mp.x-fp.x,mp.y-fp.y)<20){
        finishRoom(); return;
      }
    }
    pts.push(pt);
    render2D(); return;
  }

  // Ölçü aracı
  if(APP.activeTool==='measure'){
    if(APP.measurePts.length===0){
      APP.measurePts=[{x:APP.mouse.cx,y:APP.mouse.cy}];
    } else {
      const p1=APP.measurePts[0];
      const dim={id:newId('dim'),x1:p1.x,y1:p1.y,x2:APP.mouse.cx,y2:APP.mouse.cy};
      historySave(); APP.project.dimensions.push(dim);
      APP.measurePts=[];
      setActiveTool('select');
      render2D();
    }
    return;
  }

  // Mobilya yerleştirme
  if(isFurnTool(APP.activeTool)){
    const preset=FURNITURE_PRESETS[APP.activeTool];
    if(preset){
      const f={
        id:newId('f'),type:APP.activeTool.replace('furn-',''),
        x:APP.mouse.cx,y:APP.mouse.cy,
        w:preset.w,d:preset.d,h:preset.h,
        rot:0,color:preset.color
      };
      historySave();
      APP.project.furniture.push(f);
      setSel([{type:'furniture',id:f.id}]);
      setActiveTool('select');
      updatePropsPanel(); render2D(); render3D();
    }
    return;
  }

  // Duvar aracı
  if(APP.activeTool==='wall'){
    if(!APP.drawing){APP.drawing={x1:APP.mouse.cx,y1:APP.mouse.cy}}
    else{
      const locked=applyAngleLock(APP.drawing.x1,APP.drawing.y1,APP.mouse.cx,APP.mouse.cy);
      finishWall(APP.drawing.x1,APP.drawing.y1,locked.x,locked.y);
      APP.drawing={x1:locked.x,y1:locked.y};
    }
    render2D(); return;
  }

  // Seçim modu
  if(APP.activeTool==='select'){
    const snap={x:APP.mouse.cx,y:APP.mouse.cy};
    const add=!!e.shiftKey;
    // 1. Açıklık seçildi mi?
    const opHit=pickOpening(APP.mouseRaw.cx,APP.mouseRaw.cy);
    if(opHit){
      toggleSel({type:'opening',id:opHit.id},add);
      if(!add){APP.drag={type:'opening',opId:opHit.id,wallId:opHit.wallId};APP._dragMoved=false}
      updatePropsPanel(); render2D(); return;
    }
    // 2. Duvar uç noktası seçildi mi?
    const ep=pickEP(snap.x,snap.y);
    if(ep){
      toggleSel({type:'wall',id:ep.wallId},add);
      APP.drag={type:ep.ep,wallId:ep.wallId,lastCx:snap.x,lastCy:snap.y};
      APP._dragMoved=false;
      updatePropsPanel(); render2D(); return;
    }
    // 3. Duvar gövdesi seçildi mi?
    const wh=pickWall(snap.x,snap.y);
    if(wh){
      const already=isSelItem('wall',wh.id);
      if(add) toggleSel({type:'wall',id:wh.id},true);
      else if(!already) setSel([{type:'wall',id:wh.id}]);
      APP.drag=(!add&&already&&selList().length>1)
        ?{type:'multi',lastCx:snap.x,lastCy:snap.y}
        :{type:'wall-body',wallId:wh.id,lastCx:snap.x,lastCy:snap.y};
      APP._dragMoved=false;
      updatePropsPanel(); render2D(); return;
    }
    // 4. Mobilya seçildi mi?
    const fh=pickFurniture(APP.mouseRaw.cx,APP.mouseRaw.cy);
    if(fh){
      const already=isSelItem('furniture',fh.id);
      if(add) toggleSel({type:'furniture',id:fh.id},true);
      else if(!already) setSel([{type:'furniture',id:fh.id}]);
      APP.drag=(!add&&already&&selList().length>1)
        ?{type:'multi',lastCx:snap.x,lastCy:snap.y}
        :{type:'furniture',furnId:fh.id,lastCx:snap.x,lastCy:snap.y};
      APP._dragMoved=false;
      updatePropsPanel(); render2D(); return;
    }
    // 5. Oda seçildi mi?
    const rh=pickRoom(APP.mouseRaw.cx,APP.mouseRaw.cy);
    if(rh){
      toggleSel({type:'room',id:rh.id},add);
      if(!add){APP.drag={type:'multi',lastCx:snap.x,lastCy:snap.y};APP._dragMoved=false}
      updatePropsPanel(); render2D(); return;
    }
    // 6. Ölçü çizgisi
    const dh=pickDimension(APP.mouseRaw.cx,APP.mouseRaw.cy);
    if(dh){toggleSel({type:'dimension',id:dh.id},add);updatePropsPanel();render2D();return}
    // Boş alan: kutu seçim
    if(!add) setSel([]);
    APP.rubberBand={sx:pos.x,sy:pos.y,x:pos.x,y:pos.y,additive:add};
    updatePropsPanel(); render2D();
  }
}

function onMU(e){
  if(APP.panning){APP.panning=false;APP.panStart=null;c2.style.cursor=getCursor();return}
  if(APP.rubberBand){
    const r=APP.rubberBand;
    if(Math.hypot(r.x-r.sx,r.y-r.sy)>6) applyRubberBand(r);
    APP.rubberBand=null;
    updatePropsPanel(); render2D(); return;
  }
  if(APP.drag){if(APP._dragMoved)historySave();APP.drag=null;APP._dragMoved=false;render2D();render3D()}
  if(APP.ulDrag){APP.ulDrag=null;historySave()}
}

function onMW(e){
  e.preventDefault();
  const pos=getPos(e);
  const f=e.deltaY<0?1.12:1/1.12;
  const nz=Math.max(0.02,Math.min(50,APP.zoom*f));
  APP.pan.x=pos.x-(pos.x-APP.pan.x)*(nz/APP.zoom);
  APP.pan.y=pos.y-(pos.y-APP.pan.y)*(nz/APP.zoom);
  APP.zoom=nz; render2D(); updateStatusBar();
}

function onDbl(e){
  if(APP.activeTool==='wall'){APP.drawing=null;hideLenInput();render2D()}
  if(APP.activeTool==='room'&&APP.roomDraw&&APP.roomDraw.points.length>=3){
    // Son noktayı çıkar (çift tıkla son nokta iki kez eklendi)
    APP.roomDraw.points.pop();
    finishRoom();
  }
}

function getCursor(){
  if(APP.activeTool==='wall') return 'crosshair';
  if(APP.activeTool==='room') return 'crosshair';
  if(APP.activeTool==='underlay-move') return 'move';
  if(isOpeningTool(APP.activeTool)) return 'copy';
  if(isFurnTool(APP.activeTool)) return 'copy';
  if(APP.activeTool==='measure') return 'crosshair';
  return 'default';
}

/* ── Nesne seçimi ───────────────────── */
function pickOpening(cx,cy){
  if(!APP.project) return null;
  for(let i=APP.project.openings.length-1;i>=0;i--){
    const o=APP.project.openings[i];
    const w=APP.project.walls.find(x=>x.id===o.wallId);if(!w) continue;
    const dx=w.x2-w.x1,dy=w.y2-w.y1,l=Math.hypot(dx,dy)||1;
    const ux=dx/l,uy=dy/l,nx=-uy,ny=ux;
    const ocx=w.x1+ux*o.pos,ocy=w.y1+uy*o.pos;
    // Açıklık merkezine göre mesafe
    const distParallel=Math.abs((cx-ocx)*ux+(cy-ocy)*uy);
    const distPerp=Math.abs((cx-ocx)*nx+(cy-ocy)*ny);
    if(distParallel<=o.width/2+6&&distPerp<=(w.thickness/2)+10) return o;
  }
  return null;
}
function pickFurniture(cx,cy){
  if(!APP.project) return null;
  for(let i=APP.project.furniture.length-1;i>=0;i--){
    const f=APP.project.furniture[i];
    // Döndürülmüş dikdörtgen içinde mi? (basit AABB – rot=0 için)
    const hw=f.w/2,hd=f.d/2;
    const cos=Math.cos(-(f.rot||0)*Math.PI/180),sin=Math.sin(-(f.rot||0)*Math.PI/180);
    const lx=(cx-f.x)*cos-(cy-f.y)*sin;
    const ly=(cx-f.x)*sin+(cy-f.y)*cos;
    if(Math.abs(lx)<=hw+5&&Math.abs(ly)<=hd+5) return f;
  }
  return null;
}
function pickRoom(cx,cy){
  if(!APP.project) return null;
  for(let i=APP.project.rooms.length-1;i>=0;i--){
    const r=APP.project.rooms[i];
    if(r.points&&r.points.length>=3&&isPointInPolygon(cx,cy,r.points)) return r;
  }
  return null;
}
function finishRoom(){
  const rd=APP.roomDraw;
  if(!rd||rd.points.length<3){APP.roomDraw=null;render2D();return}
  const name=prompt(t('room_name_prompt'),'');
  const r={
    id:newId('r'),
    name:name||'',
    points:rd.points.slice(),
    floor:'rgba(200,220,200,0.25)',
    showLabel:true
  };
  historySave();
  APP.project.rooms.push(r);
  APP.roomDraw=null;
  setSel([{type:'room',id:r.id}]);
  setActiveTool('select');
  updatePropsPanel(); render2D(); render3D();
}
function pickWall(cx,cy){
  if(!APP.project) return null;
  for(let i=APP.project.walls.length-1;i>=0;i--){
    const w=APP.project.walls[i];
    if(ptSegDist(cx,cy,w.x1,w.y1,w.x2,w.y2)<=(w.thickness/2)+5) return w;
  }
  return null;
}
function pickEP(cx,cy){
  if(!APP.project) return null;
  const tol=12/APP.zoom;
  for(let i=APP.project.walls.length-1;i>=0;i--){
    const w=APP.project.walls[i];
    if(Math.hypot(cx-w.x1,cy-w.y1)<tol) return{wallId:w.id,ep:'ep1'};
    if(Math.hypot(cx-w.x2,cy-w.y2)<tol) return{wallId:w.id,ep:'ep2'};
  }
  return null;
}
function pickDimension(cx,cy){
  if(!APP.project||!APP.project.dimensions) return null;
  const tol=10/APP.zoom;
  for(let i=APP.project.dimensions.length-1;i>=0;i--){
    const d=APP.project.dimensions[i];
    if(ptSegDist(cx,cy,d.x1,d.y1,d.x2,d.y2)<=tol) return d;
  }
  return null;
}
function rectOverlap(ax,ay,bx,by,x1,y1,x2,y2){
  return !(Math.max(ax,bx)<x1||Math.min(ax,bx)>x2||Math.max(ay,by)<y1||Math.min(ay,by)>y2);
}
function applyRubberBand(r){
  if(!APP.project) return;
  const a=screenToCm(r.sx,r.sy),b=screenToCm(r.x,r.y);
  const x1=Math.min(a.x,b.x),x2=Math.max(a.x,b.x);
  const y1=Math.min(a.y,b.y),y2=Math.max(a.y,b.y);
  const hits=r.additive?selList().slice():[];
  const addHit=(item)=>{if(!hits.some(s=>s.type===item.type&&s.id===item.id)) hits.push(item)};
  APP.project.walls.forEach(w=>{if(rectOverlap(w.x1,w.y1,w.x2,w.y2,x1,y1,x2,y2)) addHit({type:'wall',id:w.id})});
  APP.project.furniture.forEach(f=>{
    if(f.x>=x1&&f.x<=x2&&f.y>=y1&&f.y<=y2) addHit({type:'furniture',id:f.id});
  });
  APP.project.rooms.forEach(rm=>{
    if(!rm.points||!rm.points.length) return;
    const xs=rm.points.map(p=>p[0]),ys=rm.points.map(p=>p[1]);
    if(rectOverlap(Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys),x1,y1,x2,y2)) addHit({type:'room',id:rm.id});
  });
  APP.project.openings.forEach(o=>{
    const w=APP.project.walls.find(x=>x.id===o.wallId);if(!w) return;
    const dx=w.x2-w.x1,dy=w.y2-w.y1,l=Math.hypot(dx,dy)||1;
    const ox=w.x1+(dx/l)*o.pos,oy=w.y1+(dy/l)*o.pos;
    if(ox>=x1&&ox<=x2&&oy>=y1&&oy<=y2) addHit({type:'opening',id:o.id});
  });
  (APP.project.dimensions||[]).forEach(d=>{
    if(rectOverlap(d.x1,d.y1,d.x2,d.y2,x1,y1,x2,y2)) addHit({type:'dimension',id:d.id});
  });
  setSel(hits);
}
function moveSelection(dcx,dcy){
  selList().forEach(s=>{
    if(s.type==='wall'){
      const w=APP.project.walls.find(x=>x.id===s.id);
      if(w){w.x1+=dcx;w.y1+=dcy;w.x2+=dcx;w.y2+=dcy}
    } else if(s.type==='furniture'){
      const f=APP.project.furniture.find(x=>x.id===s.id);
      if(f){f.x+=dcx;f.y+=dcy}
    } else if(s.type==='room'){
      const rm=APP.project.rooms.find(x=>x.id===s.id);
      if(rm) rm.points=rm.points.map(p=>[p[0]+dcx,p[1]+dcy]);
    } else if(s.type==='dimension'){
      const d=APP.project.dimensions.find(x=>x.id===s.id);
      if(d){d.x1+=dcx;d.y1+=dcy;d.x2+=dcx;d.y2+=dcy}
    }
  });
}
function copySel(){
  const items=selList(); if(!items.length) return;
  const wallIds=new Set(items.filter(s=>s.type==='wall').map(s=>s.id));
  APP.clipboard={
    walls:APP.project.walls.filter(w=>wallIds.has(w.id)).map(w=>JSON.parse(JSON.stringify(w))),
    openings:APP.project.openings.filter(o=>wallIds.has(o.wallId)).map(o=>JSON.parse(JSON.stringify(o))),
    furniture:items.filter(s=>s.type==='furniture').map(s=>APP.project.furniture.find(x=>x.id===s.id)).filter(Boolean).map(f=>JSON.parse(JSON.stringify(f))),
    rooms:items.filter(s=>s.type==='room').map(s=>APP.project.rooms.find(x=>x.id===s.id)).filter(Boolean).map(r=>JSON.parse(JSON.stringify(r))),
    dimensions:items.filter(s=>s.type==='dimension').map(s=>(APP.project.dimensions||[]).find(x=>x.id===s.id)).filter(Boolean).map(d=>JSON.parse(JSON.stringify(d)))
  };
}
function pasteSel(){
  const cl=APP.clipboard; if(!cl) return;
  historySave();
  const off=50, idMap={}, newItems=[];
  (cl.walls||[]).forEach(w=>{
    const nw={...w,id:newId('w'),x1:w.x1+off,y1:w.y1+off,x2:w.x2+off,y2:w.y2+off};
    idMap[w.id]=nw.id; APP.project.walls.push(nw); newItems.push({type:'wall',id:nw.id});
  });
  (cl.openings||[]).forEach(o=>{
    if(!idMap[o.wallId]) return;
    APP.project.openings.push({...o,id:newId('op'),wallId:idMap[o.wallId]});
  });
  (cl.furniture||[]).forEach(f=>{
    const nf={...f,id:newId('f'),x:f.x+off,y:f.y+off};
    APP.project.furniture.push(nf); newItems.push({type:'furniture',id:nf.id});
  });
  (cl.rooms||[]).forEach(r=>{
    const nr={...r,id:newId('r'),points:(r.points||[]).map(p=>[p[0]+off,p[1]+off])};
    APP.project.rooms.push(nr); newItems.push({type:'room',id:nr.id});
  });
  (cl.dimensions||[]).forEach(d=>{
    const nd={...d,id:newId('dim'),x1:d.x1+off,y1:d.y1+off,x2:d.x2+off,y2:d.y2+off};
    APP.project.dimensions.push(nd); newItems.push({type:'dimension',id:nd.id});
  });
  setSel(newItems);
  updatePropsPanel(); render2D(); render3D();
}
function offsetWall(w,distCm){
  const dx=w.x2-w.x1,dy=w.y2-w.y1,l=Math.hypot(dx,dy)||1;
  const nx=-dy/l,ny=dx/l;
  return{
    id:newId('w'),x1:w.x1+nx*distCm,y1:w.y1+ny*distCm,
    x2:w.x2+nx*distCm,y2:w.y2+ny*distCm,
    thickness:w.thickness,height:w.height,color:w.color
  };
}
function ptSegDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  if(l2===0) return Math.hypot(px-ax,py-ay);
  const t2=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));
  return Math.hypot(px-(ax+t2*dx),py-(ay+t2*dy));
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target===document.body){e.preventDefault();APP._spaceDown=true;c2.style.cursor='grab'}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') APP._shiftDown=true;
  if(e.code==='Escape'){
    APP.drawing=null; hideLenInput();
    APP.calState=null; hideCalDialog();
    APP.hoverOpening=null;
    APP.roomDraw=null;
    APP.measurePts=[]; APP.rubberBand=null;
    setActiveTool('select'); render2D();
  }
  if(e.code==='Delete'&&selList().length) deleteSelected();
  if(e.code==='Enter'&&APP.activeTool==='room'&&APP.roomDraw&&APP.roomDraw.points.length>=3){finishRoom()}
  if(e.ctrlKey&&e.code==='KeyZ'){e.preventDefault();historyUndo()}
  if(e.ctrlKey&&(e.code==='KeyY'||(e.shiftKey&&e.code==='KeyZ'))){e.preventDefault();historyRedo()}
  if(e.ctrlKey&&e.code==='KeyS'){e.preventDefault();saveProject()}
  if(e.ctrlKey&&e.code==='KeyC'&&selList().length){e.preventDefault();copySel()}
  if(e.ctrlKey&&e.code==='KeyV'&&APP.clipboard){e.preventDefault();pasteSel()}
  if(e.ctrlKey&&e.code==='KeyO'){e.preventDefault();document.getElementById('file-open').click()}
  if(e.ctrlKey&&e.code==='KeyN'){e.preventDefault();cmdNew()}
  if((e.code==='F1'||e.key==='?')&&e.target===document.body){e.preventDefault();toggleHelp()}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){APP._spaceDown=false;c2.style.cursor=getCursor()}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') APP._shiftDown=false;
});

const lenWrap=document.getElementById('len-wrap');
const lenIn=document.getElementById('len-in');
let _lenActive=false;

lenIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const val=parseFloat(lenIn.value);
    if(!isNaN(val)&&val>0&&APP.drawing){
      const lenCm=fromDisplay(val);
      const dx=APP.mouse.cx-APP.drawing.x1,dy=APP.mouse.cy-APP.drawing.y1;
      const d=Math.hypot(dx,dy)||1;
      const locked=applyAngleLock(APP.drawing.x1,APP.drawing.y1,
        APP.drawing.x1+dx/d*lenCm,APP.drawing.y1+dy/d*lenCm);
      finishWall(APP.drawing.x1,APP.drawing.y1,locked.x,locked.y);
      APP.drawing={x1:locked.x,y1:locked.y};
    }
    hideLenInput(); render2D();
  }
  if(e.key==='Escape'){hideLenInput();APP.drawing=null;setActiveTool('select');render2D()}
  e.stopPropagation();
});

function showLenInput(){if(_lenActive)return;_lenActive=true;lenIn.value='';lenWrap.style.display='flex';document.getElementById('len-unit').textContent=unitLabel();lenIn.focus()}
function hideLenInput(){_lenActive=false;lenWrap.style.display='none';lenIn.value=''}

document.addEventListener('keydown',e=>{
  if(APP.activeTool!=='wall'||!APP.drawing||e.target!==document.body) return;
  if((e.key>='0'&&e.key<='9')||e.key==='.'||e.key===','){
    showLenInput();lenIn.value=e.key===','?'.':e.key;setTimeout(()=>lenIn.setSelectionRange(1,1),0);
  }
});

function setActiveTool(tool){
  APP.activeTool=tool;
  APP.drawing=null; APP.roomDraw=null; APP.drag=null; APP.ulDrag=null; APP.hoverOpening=null; APP.rubberBand=null;
  hideLenInput();
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));
  c2.style.cursor=getCursor();
  updateStatusTip();
  const mi=document.getElementById('mode-indicator');
  if(tool!=='select'){
    let lbl=t('tool_'+tool)||tool;
    if(tool==='calibrate') lbl=t('cal_step1');
    else if(tool==='underlay-move') lbl=t('ul_move');
    else if(tool==='room') lbl=t('tip_room')||lbl;
    else if(isOpeningTool(tool)) lbl=t(tool.replace('-','_'))||tool;
    else if(isFurnTool(tool)) lbl=t(tool.replace('furn-','furn_').replace('-','_'))||tool;
    setModeIndicator(lbl);
  } else {mi.style.display='none'}
}
function setModeIndicator(txt){
  const mi=document.getElementById('mode-indicator');
  mi.textContent=txt; mi.style.display='block';
}
document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>{
  b.addEventListener('click',()=>setActiveTool(b.dataset.tool));
});

function finishWall(x1,y1,x2,y2){
  if(Math.hypot(x2-x1,y2-y1)<2) return;
  const w={id:newId('w'),x1,y1,x2,y2,
    thickness:APP.project.settings.defaultWallThickness,
    height:APP.project.settings.defaultWallHeight,color:'#f4efe6'};
  historySave();
  APP.project.walls.push(w);
  setSel([{type:'wall',id:w.id}]);
  updatePropsPanel(); render3D();
}

function deleteSelected(){
  const items=selList(); if(!items.length) return;
  historySave();
  items.forEach(({type,id})=>{
    if(type==='wall'){
      APP.project.walls=APP.project.walls.filter(w=>w.id!==id);
      APP.project.openings=APP.project.openings.filter(o=>o.wallId!==id);
    } else if(type==='opening'){
      APP.project.openings=APP.project.openings.filter(o=>o.id!==id);
    } else if(type==='room'){
      APP.project.rooms=APP.project.rooms.filter(r=>r.id!==id);
    } else if(type==='furniture'){
      APP.project.furniture=APP.project.furniture.filter(f=>f.id!==id);
    } else if(type==='dimension'){
      APP.project.dimensions=(APP.project.dimensions||[]).filter(d=>d.id!==id);
    }
  });
  setSel([]); updatePropsPanel(); render2D(); render3D();
}

function updatePropsPanel(){
  const c=document.getElementById('props-content');
  const n=selList().length;
  if(!n){c.innerHTML=`<span style="color:var(--fg3);font-size:12px">${t('select_to_see')}</span>`;return}
  if(n>1){
    c.innerHTML=`
      <div class="prop-info" style="border:none;margin:0;padding:0">${n} ${t('multi_selected')}</div>
      <div class="prop-row" style="margin-top:10px">
        <button class="small-btn danger" id="pp-del-multi" style="width:100%">${t('btn_delete_all')}</button>
      </div>`;
    document.getElementById('pp-del-multi').addEventListener('click',deleteSelected);
    return;
  }
  const{type,id}=APP.selected;

  if(type==='wall'){
    const w=APP.project.walls.find(x=>x.id===id);if(!w){c.innerHTML='';return}
    const len=Math.hypot(w.x2-w.x1,w.y2-w.y1);
    c.innerHTML=`
      <div class="prop-row">
        <label>${t('prop_length')}</label>
        <input type="number" id="pp-len" value="${toDisplay(len)}" min="1" step="any">
        <span class="prop-unit">${unitLabel()}</span>
      </div>
      <div class="prop-row">
        <label>${t('prop_height')}</label>
        <input type="number" id="pp-h" value="${w.height}" min="50" max="2000">
        <span class="prop-unit">cm</span>
      </div>
      <div class="prop-row">
        <label>${t('prop_thick')}</label>
        <input type="number" id="pp-th" value="${w.thickness}" min="5" max="200">
        <span class="prop-unit">cm</span>
      </div>
      <div class="prop-row">
        <label>${t('prop_color')}</label>
        <input type="color" id="pp-col" value="${w.color||'#f4efe6'}">
      </div>
      <div class="prop-row" style="margin-top:8px">
        <label>${t('prop_offset')}</label>
        <input type="number" id="pp-off" value="${toDisplay(w.thickness)}" step="any">
        <span class="prop-unit">${unitLabel()}</span>
      </div>
      <div class="prop-row">
        <button class="small-btn" id="pp-offset" style="width:100%">${t('btn_offset')}</button>
      </div>
      <div class="prop-row" style="margin-top:8px">
        <button class="small-btn danger" id="pp-del-wall" style="width:100%">${t('btn_delete')}</button>
      </div>
      <div class="prop-info">${t('wall_id')}: ${w.id}</div>
    `;
    document.getElementById('pp-len').addEventListener('change',e=>{
      const nl=fromDisplay(parseFloat(e.target.value)||len);
      const dx=w.x2-w.x1,dy=w.y2-w.y1,d=Math.hypot(dx,dy)||1;
      historySave(); w.x2=w.x1+dx/d*nl; w.y2=w.y1+dy/d*nl;
      // Kısaltıldığında taşan açıklıkları sınırla
      APP.project.openings.filter(o=>o.wallId===w.id).forEach(o=>{
        if(o.pos+o.width/2>nl) o.pos=Math.max(o.width/2,nl-o.width/2);
      });
      render2D(); render3D();
    });
    document.getElementById('pp-h').addEventListener('change',e=>{historySave();w.height=+e.target.value||270;render3D()});
    document.getElementById('pp-th').addEventListener('change',e=>{historySave();w.thickness=+e.target.value||20;render2D();render3D()});
    document.getElementById('pp-col').addEventListener('input',e=>{w.color=e.target.value;render2D();render3D()});
    document.getElementById('pp-offset').addEventListener('click',()=>{
      const dist=fromDisplay(parseFloat(document.getElementById('pp-off').value)||0);
      if(!dist) return;
      historySave();
      const nw=offsetWall(w,dist);
      APP.project.walls.push(nw);
      setSel([{type:'wall',id:nw.id}]);
      updatePropsPanel(); render2D(); render3D();
    });
    document.getElementById('pp-del-wall').addEventListener('click',deleteSelected);
  } else if(type==='opening'){
    const o=APP.project.openings.find(x=>x.id===id);if(!o){c.innerHTML='';return}
    const w=APP.project.walls.find(x=>x.id===o.wallId);
    const wLen=w?Math.hypot(w.x2-w.x1,w.y2-w.y1):1000;
    const isDoor=o.type.startsWith('door');

    c.innerHTML=`
      <div class="prop-row">
        <label>${t('prop_width')}</label>
        <input type="number" id="op-w" value="${toDisplay(o.width)}" min="20" max="${toDisplay(wLen)}" step="any">
        <span class="prop-unit">${unitLabel()}</span>
      </div>
      <div class="prop-row">
        <label>${t('prop_height')}</label>
        <input type="number" id="op-h" value="${toDisplay(o.height)}" min="20" max="400" step="any">
        <span class="prop-unit">${unitLabel()}</span>
      </div>
      <div class="prop-row">
        <label>${t('prop_sill')}</label>
        <input type="number" id="op-sill" value="${toDisplay(o.sill||0)}" min="0" max="300" step="any">
        <span class="prop-unit">${unitLabel()}</span>
      </div>
      <div class="prop-row">
        <label>${t('prop_pos')}</label>
        <input type="number" id="op-pos" value="${toDisplay(o.pos)}" min="${toDisplay(o.width/2)}" max="${toDisplay(wLen-o.width/2)}" step="any">
        <span class="prop-unit">${unitLabel()}</span>
      </div>
      ${isDoor?`
      <div class="prop-row">
        <label>${t('prop_flip')}</label>
        <select id="op-flip">
          <option value="false" ${!o.flip?'selected':''}>${t('flip_norm')}</option>
          <option value="true" ${o.flip?'selected':''}>${t('flip_rev')}</option>

      </div>
      <div class="prop-row">
        <label>${t('prop_swing')}</label>
        <select id="op-swing">
          <option value="in" ${o.swing==='in'?'selected':''}>${t('swing_in')}</option>
          <option value="out" ${o.swing==='out'?'selected':''}>${t('swing_out')}</option>
        </select>
      </div>`:''}
      <div class="prop-row" style="margin-top:8px">
        <button class="small-btn danger" id="op-del" style="width:100%">${t('btn_delete')}</button>
      </div>
      <div class="prop-info">ID: ${o.id} &nbsp;|&nbsp; ${t(o.type.replace('-','_'))||o.type}</div>
    `;

    document.getElementById('op-w').addEventListener('change',e=>{
      const nw=fromDisplay(parseFloat(e.target.value)||o.width);
      if(w&&validateOpeningPlacement(w,o.pos,nw,o.id).valid){
        historySave(); o.width=nw; render2D(); render3D();
      } else { e.target.value=toDisplay(o.width); }
    });

      historySave(); o.height=fromDisplay(parseFloat(e.target.value)||o.height); render2D(); render3D();
    });

    });
    document.getElementById('op-pos').addEventListener('change',e=>{
      const npos=fromDisplay(parseFloat(e.target.value)||o.pos);

  } else if(type==='room'){
    const r=APP.project.rooms.find(x=>x.id===id);if(!r){c.innerHTML='';return}
    const area_cm2=polyArea(r.points);

    const bb=polyBBox(r.points);

    const FLOOR_PRESETS=[
      {key:'wood',  color:'#c8a46e',label:t('floor_wood')},
      {key:'tile',  color:'#e0e0e0',label:t('floor_tile')},

    c.innerHTML=`
      <div class="prop-row">
        <label>${t('prop_room_name')}</label>
        <input type="text" id="rp-name" value="${(r.name||'').replace(/"/g,'&quot;')}" style="flex:1">
      </div>
      <div class="prop-row" style="align-items:flex-start;flex-direction:column;gap:4px">
        <label style="margin-bottom:2px">${t('prop_floor')}</label>

    document.getElementById('rp-floor').addEventListener('input',e=>{

    });

    c.querySelectorAll('[data-fc]').forEach(el=>{
