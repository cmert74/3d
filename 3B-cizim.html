function loadUnderlay(file){
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name||'')){loadPdfUnderlay(file);return}
  const reader=new FileReader();
  reader.onload=ev=>applyUnderlayImage(ev.target.result);
  reader.onerror=()=>alert(t('underlay_load_error'));
  reader.readAsDataURL(file);
}
function applyUnderlayImage(dataUrl){
  const img=new Image();
  img.onload=()=>{
    historySave();
    const cx=(c2.width/2-APP.pan.x)/APP.zoom;
    const cy=(c2.height/2-APP.pan.y)/APP.zoom;
    APP.project.underlay={
      imageDataUrl:dataUrl,
      x:cx-img.width/2,y:cy-img.height/2,
      scale:1.0,rotation:0,opacity:0.4,
      visible:true,locked:false,calibrated:false,
      includeInSave:true,
      _img:img
    };
    refreshUnderlayPanel();
    render2D();
  };
  img.onerror=()=>alert(t('underlay_load_error'));
  img.src=dataUrl;
}
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(window._pdfjsLoad) return window._pdfjsLoad;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  window._pdfjsLoad=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=base+'pdf.min.js';
    s.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'}catch(e){}res()};
    s.onerror=rej;
    document.head.appendChild(s);
  });
  return window._pdfjsLoad;
}
function loadPdfUnderlay(file){
  ensurePdfJs().then(()=>{
    const r=new FileReader();
    r.onerror=()=>alert(t('underlay_load_error'));
    r.onload=()=>{
      pdfjsLib.getDocument({data:new Uint8Array(r.result)}).promise.then(pdf=>{
        pdf.getPage(1).then(page=>{
          const vp=page.getViewport({scale:2});
          const cv=document.createElement('canvas');
          cv.width=vp.width;cv.height=vp.height;
          const cx=cv.getContext('2d');
          page.render({canvasContext:cx,viewport:vp}).promise.then(()=>{
            applyUnderlayImage(cv.toDataURL('image/png'));
          }).catch(()=>alert(t('underlay_load_error')));
        }).catch(()=>alert(t('underlay_load_error')));
      }).catch(()=>alert(t('underlay_load_error')));
    };
    r.readAsArrayBuffer(file);
  }).catch(()=>alert(t('pdf_lib_error')));
}

function applyCalibration(cx1,cy1,cx2,cy2,realDistCm){
  const u=APP.project.underlay;if(!u) return;
  const worldDist=Math.hypot(cx2-cx1,cy2-cy1);if(worldDist<1) return;
  const newScale=realDistCm*u.scale/worldDist;
  const ipx1=(cx1-u.x)/u.scale,ipy1=(cy1-u.y)/u.scale;
  historySave();
  u.scale=newScale;
  u.x=cx1-ipx1*newScale; u.y=cy1-ipy1*newScale;
  u.calibrated=true;
  refreshUnderlayPanel();
  APP.calState=null; setActiveTool('select'); render2D();
}

const HIST={stack:[],idx:-1,MAX:50};
let _savedState=null; // Son kaydedilen JSON (beforeunload için)

function historySave(){
  HIST.stack.splice(HIST.idx+1);
  const snap=JSON.stringify(APP.project,(_k,v)=>_k==='_img'?undefined:v);
  HIST.stack.push(snap);
  if(HIST.stack.length>HIST.MAX) HIST.stack.shift();
  HIST.idx=HIST.stack.length-1;
  // Otomatik yedek localStorage'a
  try{localStorage.setItem('plan3d_autosave',snap)}catch(e){}
}
function historyUndo(){
  if(HIST.idx<=0) return;
  HIST.idx--;
  restoreProject(JSON.parse(HIST.stack[HIST.idx]));
}
function historyRedo(){
  if(HIST.idx>=HIST.stack.length-1) return;
  HIST.idx++;
  restoreProject(JSON.parse(HIST.stack[HIST.idx]));
}
function restoreProject(data){
  APP.project=normalizeProject(data);
  reloadUnderlayImage();
  setSel([]); updatePropsPanel(); refreshUnderlayPanel(); render2D(); render3D();
}
function reloadUnderlayImage(){
  const u=APP.project&&APP.project.underlay;
  if(u&&u.imageDataUrl&&!u._img){
    const img=new Image();
    img.onload=()=>{u._img=img;render2D()};
    img.src=u.imageDataUrl;
  }
}

function saveProject(){
  if(!APP.project) return;
  APP.project.settings.lang=APP.lang; APP.project.settings.unit=APP.unit;
  const clone=JSON.parse(JSON.stringify(APP.project,(k,v)=>{
    if(k==='_img') return undefined;
    if(k==='imageDataUrl'){
      const u=APP.project.underlay;
      if(u&&u.includeInSave===false) return undefined;
    }
    return v;
  }));
  const json=JSON.stringify(clone,null,2);
  _savedState=json;
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='plan.plan3d.json'; a.click();
  URL.revokeObjectURL(a.href);
}

function openProject(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.version||!data.walls) throw new Error();
      APP.project=normalizeProject(data);
      reloadUnderlayImage();
      APP.lang=data.settings.lang||APP.lang;
      APP.unit=data.settings.unit||APP.unit;
      document.getElementById('sel-lang').value=APP.lang;
      document.getElementById('sel-unit').value=APP.unit;
      applyI18N(); refreshUnderlayPanel();
      HIST.stack=[];HIST.idx=-1;historySave();
      _savedState=HIST.stack[0];
      setSel([]); updatePropsPanel();
      centerView(); render2D(); render3D();
    }catch{alert(t('invalid_file'))}
  };
  r.readAsText(file);
}

function centerView(){
  if(!APP.project||APP.project.walls.length===0){APP.pan={x:c2.width/2,y:c2.height/2};APP.zoom=1;return}
  let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity;
  APP.project.walls.forEach(w=>{mnX=Math.min(mnX,w.x1,w.x2);mnY=Math.min(mnY,w.y1,w.y2);mxX=Math.max(mxX,w.x1,w.x2);mxY=Math.max(mxY,w.y1,w.y2)});
  const W=c2.width,H=c2.height,mg=80;
  APP.zoom=Math.min((W-mg*2)/((mxX-mnX)||1),(H-mg*2)/((mxY-mnY)||1),5);
  APP.pan.x=W/2-((mnX+mxX)/2)*APP.zoom; APP.pan.y=H/2-((mnY+mxY)/2)*APP.zoom;
}

function cmdNew(){
  if(APP.project&&APP.project.walls.length>0&&!confirm(t('unsaved_warn'))) return;
  APP.project=newProject(); setSel([]);
  HIST.stack=[];HIST.idx=-1;historySave();
  _savedState=HIST.stack[0];
  refreshUnderlayPanel(); updatePropsPanel(); render2D(); render3D();
}

   3B SAHNE & DUVAR KESME MOTORU (Three.js)
═══════════════════════════════════════ */
let THREE_OK=false,renderer3d,scene3d,camera3d,_3dGroup=null;
let _camTheta=Math.PI/4,_camPhi=Math.PI/3,_camDist=1500;
let _camTgt={x:0,y:0,z:0};
let _c3drag=false,_c3last=null,_c3btn=0,_animReq=null;

function init3D(){
  if(!window.THREE||THREE_OK) return;
  THREE_OK=true;
  const cont=document.getElementById('canvas3d-container');
  renderer3d=new THREE.WebGLRenderer({canvas:document.getElementById('canvas3d'),antialias:true,preserveDrawingBuffer:true});
  renderer3d.setPixelRatio(window.devicePixelRatio);
  renderer3d.setSize(cont.clientWidth,cont.clientHeight);
  renderer3d.shadowMap.enabled=true;
  renderer3d.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer3d.setClearColor(0xd4dde6);
  scene3d=new THREE.Scene();
  scene3d.fog=new THREE.Fog(0xd4dde6,2000,8000);
  camera3d=new THREE.PerspectiveCamera(45,cont.clientWidth/cont.clientHeight,1,10000);
  updateCam3D();
  scene3d.add(new THREE.HemisphereLight(0xffffff,0xe0e8f0,.75));
  const dl=new THREE.DirectionalLight(0xffffff,.8);
  dl.position.set(500,1000,500);dl.castShadow=true;
  dl.shadow.mapSize.set(1024,1024);scene3d.add(dl);
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(10000,10000),new THREE.MeshLambertMaterial({color:0xe8ede8}));
  gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene3d.add(gnd);
  const c3=document.getElementById('canvas3d');
  c3.addEventListener('mousedown',e=>{_c3drag=true;_c3last={x:e.clientX,y:e.clientY};_c3btn=e.button;e.preventDefault()});
  c3.addEventListener('mousemove',e=>{
    if(!_c3drag||!_c3last) return;
    const dx=e.clientX-_c3last.x,dy=e.clientY-_c3last.y;
    _c3last={x:e.clientX,y:e.clientY};
    if(_c3btn===0){_camTheta-=dx*.01;_camPhi=Math.max(.05,Math.min(Math.PI/2-.01,_camPhi-dy*.01))}
    else{const spd=_camDist*.001;_camTgt.x-=Math.cos(_camTheta)*dx*spd;_camTgt.z+=Math.sin(_camTheta)*dx*spd;_camTgt.y+=dy*spd}
    updateCam3D();render3D();
  });
  c3.addEventListener('mouseup',()=>{_c3drag=false});
  c3.addEventListener('wheel',e=>{e.preventDefault();_camDist=Math.max(50,Math.min(5000,_camDist*(e.deltaY>0?1.12:.9)));updateCam3D();render3D()},{passive:false});
  c3.addEventListener('contextmenu',e=>e.preventDefault());
  document.querySelectorAll('.view-btn').forEach(b=>b.addEventListener('click',()=>setView3D(b.dataset.view)));
  render3D();
}

function updateCam3D(){
  if(!camera3d) return;
  camera3d.position.set(
    _camTgt.x+_camDist*Math.sin(_camPhi)*Math.sin(_camTheta),
    _camTgt.y+_camDist*Math.cos(_camPhi),
    _camTgt.z+_camDist*Math.sin(_camPhi)*Math.cos(_camTheta));
  camera3d.lookAt(_camTgt.x,_camTgt.y,_camTgt.z);
  camera3d.updateProjectionMatrix();
}
function setView3D(view){
  // Plan boyutuna göre otomatik kamera mesafesi
  let autoDist=_camDist;
  if(APP.project&&APP.project.walls.length>0){
    let mnX=Infinity,mnY=Infinity,mxX=-Infinity,mxY=-Infinity;
    APP.project.walls.forEach(w=>{mnX=Math.min(mnX,w.x1,w.x2);mnY=Math.min(mnY,w.y1,w.y2);mxX=Math.max(mxX,w.x1,w.x2);mxY=Math.max(mxY,w.y1,w.y2)});
    autoDist=Math.max(500,Math.min(5000,Math.max(mxX-mnX,mxY-mnY)*1.5));
  }
  const st={theta:_camTheta,phi:_camPhi,dist:_camDist};
  const tgts={
    plan:{theta:0,phi:.05,dist:autoDist},
    iso:{theta:Math.PI/4,phi:Math.PI/4,dist:autoDist},
    persp:{theta:Math.PI/5,phi:Math.PI/3.5,dist:autoDist},
    side:{theta:0,phi:Math.PI/4,dist:autoDist},
    corner:{theta:Math.PI*.75,phi:Math.PI/4,dist:autoDist}
  };
  const tgt=tgts[view];if(!tgt) return;
  const dur=600,t0=performance.now();
  if(_animReq) cancelAnimationFrame(_animReq);
  function step(now){
    const p=Math.min(1,(now-t0)/dur),e2=1-Math.pow(1-p,3);
    _camTheta=st.theta+(tgt.theta-st.theta)*e2;
    _camPhi=st.phi+(tgt.phi-st.phi)*e2;
    _camDist=st.dist+(tgt.dist-st.dist)*e2;
    updateCam3D();render3D();if(p<1)_animReq=requestAnimationFrame(step);
  }
  _animReq=requestAnimationFrame(step);
}

function render3D(){
  if(!THREE_OK||!renderer3d) return;
  if(_3dGroup){scene3d.remove(_3dGroup);_3dGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}
  _3dGroup=new THREE.Group();
  if(APP.project){
    const p=APP.project;
    let mnX=0,mnY=0,mxX=0,mxY=0;
    if(p.walls.length>0){
      mnX=Infinity;mnY=Infinity;mxX=-Infinity;mxY=-Infinity;
      p.walls.forEach(w=>{mnX=Math.min(mnX,w.x1,w.x2);mnY=Math.min(mnY,w.y1,w.y2);mxX=Math.max(mxX,w.x1,w.x2);mxY=Math.max(mxY,w.y1,w.y2)});
    }
    const cx=(mnX+mxX)/2,cz=(mnY+mxY)/2;
    p.walls.forEach(w=>build3DWallWithOpenings(w,cx,cz));
    p.rooms.forEach(r=>b3DRoom(r,cx,cz));
    p.furniture.forEach(f=>b3DFurn(f,cx,cz));
  }
  scene3d.add(_3dGroup); renderer3d.render(scene3d,camera3d);
}

/**
 * 3B Duvar Oluşturma – Açıklıkları GERÇEKTEN Keserek (Subdivision)
 */
function build3DWallWithOpenings(w,cx,cz){
  const dx=w.x2-w.x1,dz=w.y2-w.y1,len=Math.hypot(dx,dz);if(len<1)return;
  const h=(w.height||270)*(APP.cutSection?0.4:1),th=w.thickness||20;
  const{ext1,ext2}=wallExtensions(w);

  // Bu duvara ait açıklıklar (pos'a göre sıralı)
  const ops=APP.project.openings
    .filter(o=>o.wallId===w.id)
    .sort((a,b)=>a.pos-b.pos);

  // Duvar için Three.js grubu
  const wallGroup=new THREE.Group();
  wallGroup.position.set(w.x1-cx,0,w.y1-cz);
  wallGroup.rotation.y=-Math.atan2(dz,dx);

  const wallMat=new THREE.MeshLambertMaterial({color:new THREE.Color(w.color||'#f4efe6')});
  const glassMat=new THREE.MeshLambertMaterial({color:0x93c5fd,transparent:true,opacity:0.45});
  const frameMat=new THREE.MeshLambertMaterial({color:0x475569});
  const doorMat=new THREE.MeshLambertMaterial({color:0xb45309});

  let currentX=-ext1;

  for(const o of ops){
    const oStart=Math.max(0,o.pos-o.width/2);
    const oEnd=Math.min(len,o.pos+o.width/2);

    // 1. Açıklıktan önceki tam duvar parçası
    if(oStart>currentX){
      const segLen=oStart-currentX;
      const segX=currentX+segLen/2;
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(segLen,h,th),wallMat);
      mesh.position.set(segX,h/2,0);
      mesh.castShadow=true; mesh.receiveShadow=true;
      wallGroup.add(mesh);
    }

    // 2. Açıklık kesiti (Denizlik altı ve lento üstü)
    const holeLen=oEnd-oStart;
    const holeX=oStart+holeLen/2;
    const sill=Math.max(0,o.sill||0);
    const openH=Math.min(h-sill,o.height||210);
    const lintelH=Math.max(0,h-(sill+openH));

    // Denizlik altı duvar
    if(sill>0){
      const sillMesh=new THREE.Mesh(new THREE.BoxGeometry(holeLen,sill,th),wallMat);
      sillMesh.position.set(holeX,sill/2,0);
      sillMesh.castShadow=true; sillMesh.receiveShadow=true;
      wallGroup.add(sillMesh);
    }

    // Lento üstü duvar
    if(lintelH>0){
      const lintelMesh=new THREE.Mesh(new THREE.BoxGeometry(holeLen,lintelH,th),wallMat);
      lintelMesh.position.set(holeX,h-lintelH/2,0);
      lintelMesh.castShadow=true; lintelMesh.receiveShadow=true;
      wallGroup.add(lintelMesh);
    }

    // 3. Açıklık içindeki 3B elemanlar (cam / kapı kanadı)
    const isWin=o.type.startsWith('win');
    const isDoor=o.type.startsWith('door');

    if(isWin){
      // Cam paneli
      const glassH=Math.max(1,openH-4);
      const glassW=Math.max(1,holeLen-4);
      const glass=new THREE.Mesh(new THREE.BoxGeometry(glassW,glassH,4),glassMat);
      glass.position.set(holeX,sill+openH/2,0);
      wallGroup.add(glass);
      // Pencere çerçevesi alt/üst/yan çıtalar
      const frame=new THREE.Mesh(new THREE.BoxGeometry(holeLen,openH,th*0.4),frameMat);
      frame.position.set(holeX,sill+openH/2,0);
      frame.scale.set(0.98,0.98,0.3);
      // İsteğe bağlı sade çerçeve
    } else if(isDoor&&o.type!=='door-opening'){
      // Kapı kanadı
      const doorLeafH=Math.max(1,openH-2);
      const doorLeafW=Math.max(1,holeLen-3);
      const leaf=new THREE.Mesh(new THREE.BoxGeometry(doorLeafW,doorLeafH,6),doorMat);
      leaf.position.set(holeX,sill+doorLeafH/2,0);
      leaf.castShadow=true;
      wallGroup.add(leaf);
    }

    currentX=oEnd;
  }

  // Son parçadan duvar sonuna (ve köşe uzantısına) kadar olan duvar
  if(currentX<len+ext2){
    const segLen=(len+ext2)-currentX;
    const segX=currentX+segLen/2;
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(segLen,h,th),wallMat);
    mesh.position.set(segX,h/2,0);
    mesh.castShadow=true; mesh.receiveShadow=true;
    wallGroup.add(mesh);
  }

  _3dGroup.add(wallGroup);
}

function b3DRoom(r,cx,cz){
  if(!r.points||r.points.length<3) return;
  // Zemin yüzeyi
  const shape=new THREE.Shape();
  shape.moveTo(r.points[0][0]-cx,-(r.points[0][1]-cz));
  for(let i=1;i<r.points.length;i++) shape.lineTo(r.points[i][0]-cx,-(r.points[i][1]-cz));
  shape.closePath();
  const floorColor=r.floor&&r.floor.startsWith('#')?r.floor:'#c8d9b8';
  const mesh=new THREE.Mesh(
    new THREE.ShapeGeometry(shape),
    new THREE.MeshLambertMaterial({color:new THREE.Color(floorColor),side:THREE.DoubleSide})
  );
  mesh.rotation.x=-Math.PI/2; mesh.position.y=0.5; _3dGroup.add(mesh);

  // 3B etiket (CanvasTexture sprite) – zemin hemen üstünde
  if(r.showLabel!==false&&r.name){
    const area_m2=(polyArea(r.points)/10000).toFixed(1).replace('.',',');
    const bb=polyBBox(r.points);
    const dimStr=`${toDisplay(bb.w)} × ${toDisplay(bb.h)} ${unitLabel()}`;

    // CanvasTexture oluştur
    const cv=document.createElement('canvas');
    cv.width=512; cv.height=128;
    const lc=cv.getContext('2d');
    lc.clearRect(0,0,512,128);
    lc.fillStyle='rgba(255,255,255,0.75)';
    lc.beginPath();
    if(lc.roundRect) lc.roundRect(4,4,504,120,12);
    else lc.rect(4,4,504,120);
    lc.fill();
    lc.fillStyle='#1e293b';
    lc.font='bold 32px sans-serif'; lc.textAlign='center'; lc.textBaseline='top';
    lc.fillText(r.name.toUpperCase(),256,8);
    lc.font='22px sans-serif'; lc.fillStyle='#475569';
    lc.fillText(dimStr,256,46);
    lc.font='bold 22px sans-serif'; lc.fillStyle='#2563eb';
    lc.fillText(`${area_m2} m²`,256,74);

    const tex=new THREE.CanvasTexture(cv);
    const spriteMat=new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true});
    const sprite=new THREE.Sprite(spriteMat);
    // Merkez (bounding box ortası)
    const mx=(bb.minX+bb.maxX)/2-cx;
    const mz=(bb.minY+bb.maxY)/2-cz;
    // Genişliği odanın kısa kenarına oranla ölçekle
    const scaleFac=Math.min(bb.w,bb.h)*0.6;
    sprite.scale.set(scaleFac,scaleFac*0.25,1);
    sprite.position.set(mx,2,mz);
    _3dGroup.add(sprite);
  }
}
function b3DFurn(f,cx,cz){
  const mat=new THREE.MeshLambertMaterial({color:new THREE.Color(f.color||'#a5754b')});
  const grp=new THREE.Group();
  grp.position.set(f.x-cx,0,f.y-cz);
  grp.rotation.y=-(f.rot||0)*Math.PI/180;
  const W=f.w||100,D=f.d||60,H=f.h||75;
  const t=f.type;

  if(t==='bed'){
    // Yatak: gövde + yastık
    const body=new THREE.Mesh(new THREE.BoxGeometry(W,H*0.5,D),mat);
    body.position.set(0,H*0.25,0); grp.add(body);
    const pillow=new THREE.Mesh(new THREE.BoxGeometry(W*0.9,H*0.15,D*0.3),
      new THREE.MeshLambertMaterial({color:0xffffff}));
    pillow.position.set(0,H*0.55,-D*0.3); grp.add(pillow);
  } else if(t==='sofa'){
    // Koltuk: oturma + arka + kollar
    const seat=new THREE.Mesh(new THREE.BoxGeometry(W,H*0.5,D*0.65),mat);
    seat.position.set(0,H*0.25,D*0.15); grp.add(seat);
    const back=new THREE.Mesh(new THREE.BoxGeometry(W,H,D*0.3),mat);
    back.position.set(0,H*0.5,-D*0.35); grp.add(back);
    [-W/2+W*0.1,W/2-W*0.1].forEach(ax=>{
      const arm=new THREE.Mesh(new THREE.BoxGeometry(W*0.15,H*0.7,D),mat);
      arm.position.set(ax,H*0.35,0); grp.add(arm);
    });
  } else if(t==='toilet'){
    // Klozet: oval cisim + tank
    const bowl=new THREE.Mesh(new THREE.CylinderGeometry(W*0.4,W*0.35,H,16),mat);
    bowl.position.set(0,H/2,D*0.1); grp.add(bowl);
    const tank=new THREE.Mesh(new THREE.BoxGeometry(W*0.85,H*1.1,D*0.3),mat);
    tank.position.set(0,H*0.55,-D*0.35); grp.add(tank);
  } else if(t==='bath'){
    // Küvet: içi oyuk görünüm (ince duvarlar)
    const outer=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),mat);
    outer.position.set(0,H/2,0); grp.add(outer);
    const inner=new THREE.Mesh(new THREE.BoxGeometry(W*0.85,H*0.6,D*0.75),
      new THREE.MeshLambertMaterial({color:0xdbeafe}));
    inner.position.set(0,H*0.75,0); grp.add(inner);
  } else {
    // Genel kutu (masa, sandalye, dolap, lavabo, tezgah)
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),mat);
    mesh.position.set(0,H/2,0); grp.add(mesh);
    if(t==='table'){
      // Masa: 4 ayak
      const legMat=new THREE.MeshLambertMaterial({color:new THREE.Color(f.color||'#a5754b').multiplyScalar(0.75)});
      [[W/2-5,-D/2+5],[W/2-5,D/2-5],[-W/2+5,-D/2+5],[-W/2+5,D/2-5]].forEach(([lx,lz])=>{
        const leg=new THREE.Mesh(new THREE.BoxGeometry(8,H*0.9,8),legMat);
        leg.position.set(lx,H*0.45,lz); grp.add(leg);
      });
    }
  }
  grp.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
  _3dGroup.add(grp);
}

/* ═══════════════════════════════════════
   DIŞA AKTARMA (GLB / PDF / HTML Görüntüleyici)
═══════════════════════════════════════ */
function downloadBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function loadScriptOnce(urls){
  return new Promise((res,rej)=>{
    let i=0;
    (function next(){
      if(i>=urls.length){rej(new Error('load fail'));return}
      const s=document.createElement('script'); s.src=urls[i++];
      s.onload=()=>res(); s.onerror=()=>{s.remove();next()};
      document.head.appendChild(s);
    })();
  });
}
function fitBox(iw,ih,maxW,maxH){const r=Math.min(maxW/iw,maxH/ih);return{w:iw*r,h:ih*r}}
function projectClone(){
  const data=JSON.parse(JSON.stringify(APP.project,(k,v)=>{
    if(k==='_img') return undefined;
    if(k==='imageDataUrl'){const u=APP.project.underlay;if(u&&u.includeInSave===false)return undefined}
    return v;
  }));
  data.settings=data.settings||{}; data.settings.lang=APP.lang; data.settings.unit=APP.unit;
  return data;
}
function getThreeSource(){
  const urls=['three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'];
  return new Promise(res=>{
    let i=0;
    (function next(){
      if(i>=urls.length){res(null);return}
      fetch(urls[i++]).then(r=>r.ok?r.text():Promise.reject()).then(tx=>res(tx)).catch(next);
    })();
  });
}
/* ── 3B model (GLB) ── */
function exportGLB(){
  if(!THREE_OK||!_3dGroup){alert(t('need_3d'));return}
  const ensure=()=>THREE.GLTFExporter?Promise.resolve():loadScriptOnce([
    'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js',
    'https://unpkg.com/three@0.128.0/examples/js/exporters/GLTFExporter.js'
  ]);
  ensure().then(()=>{
    const ex=new THREE.GLTFExporter();
    ex.parse(_3dGroup,result=>{
      downloadBlob(new Blob([result],{type:'model/gltf-binary'}),'plan.glb');
    },{binary:true});
  }).catch(()=>alert(t('export_fail')));
}
/* ── PDF (2B plan + 3B görüntü) ── */
function exportPDF(){
  if(!APP.project){return}
  const ensure=()=>{
    if(window.jspdf&&window.jspdf.jsPDF) return Promise.resolve();
    return loadScriptOnce(['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js']);
  };
  ensure().then(()=>{
    const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const pw=297,ph=210,m=12;
    pdf.setFontSize(16); pdf.text('PLAN3D',m,16);
    const b2=fitBox(c2.width,c2.height,pw-m*2,ph-26-m);
    pdf.addImage(c2.toDataURL('image/png'),'PNG',(pw-b2.w)/2,24,b2.w,b2.h);
    if(renderer3d){
      render3D();
      const dc=renderer3d.domElement;
      const b3=fitBox(dc.width,dc.height,pw-m*2,ph-26-m);
      pdf.addPage();
      pdf.setFontSize(14); pdf.text(t('view_iso'),m,16);
      pdf.addImage(dc.toDataURL('image/png'),'PNG',(pw-b3.w)/2,24,b3.w,b3.h);
    }
    pdf.save('plan.pdf');
  }).catch(()=>alert(t('export_fail')));
}
/* ── HTML (etkileşimli 3B görüntüleyici) ── */

<!-- Dışa aktarılan HTML için 3B görüntüleyici şablonu (tipi özel olduğu için çalışmaz, metin olarak okunur) -->
<script type="text/template" id="tpl-viewer">
(function(){
  var P=window.PLAN||{walls:[],openings:[],rooms:[],furniture:[],settings:{}};
  var U=(P.settings&&P.settings.unit)||'cm';
  var LANG=(P.settings&&P.settings.lang)||'tr';
  var UF={mm:10,cm:1,m:0.01,km:0.00001},UD={mm:0,cm:0,m:2,km:4};
  function toD(cm){var v=cm*(UF[U]||1),d=(UD[U]==null?0:UD[U]);return parseFloat(v.toFixed(d))}
  function uLabel(){return U==='cm'?(LANG==='az'?'sm':'cm'):U}
  function polyArea(pts){var a=0,n=pts.length;for(var i=0;i<n;i++){var j=(i+1)%n;a+=pts[i][0]*pts[j][1]-pts[j][0]*pts[i][1]}return Math.abs(a)/2}
  function polyBBox(pts){var a=1e9,b=1e9,c=-1e9,d=-1e9;for(var i=0;i<pts.length;i++){a=Math.min(a,pts[i][0]);b=Math.min(b,pts[i][1]);c=Math.max(c,pts[i][0]);d=Math.max(d,pts[i][1])}return{minX:a,minY:b,maxX:c,maxY:d,w:c-a,h:d-b}}
  function wallExt(w){var e1=0,e2=0,snap=5;for(var i=0;i<P.walls.length;i++){var o=P.walls[i];if(o.id===w.id)continue;var q=[{x:o.x1,y:o.y1},{x:o.x2,y:o.y2}];for(var k=0;k<2;k++){if(Math.hypot(w.x1-q[k].x,w.y1-q[k].y)<snap)e1=Math.max(e1,o.thickness/2);if(Math.hypot(w.x2-q[k].x,w.y2-q[k].y)<snap)e2=Math.max(e2,o.thickness/2)}}return{e1:e1,e2:e2}}

  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0xd4dde6);
  document.getElementById('app').appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0xd4dde6,2000,8000);
  var camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,1,10000);
  scene.add(new THREE.HemisphereLight(0xffffff,0xe0e8f0,0.75));
  var dlight=new THREE.DirectionalLight(0xffffff,0.8);
  dlight.position.set(500,1000,500); dlight.castShadow=true; dlight.shadow.mapSize.set(1024,1024);
  scene.add(dlight);
  var gnd=new THREE.Mesh(new THREE.PlaneGeometry(10000,10000),new THREE.MeshLambertMaterial({color:0xe8ede8}));
  gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);

  var mnX=0,mnY=0,mxX=0,mxY=0;
  if(P.walls.length){mnX=1e9;mnY=1e9;mxX=-1e9;mxY=-1e9;
    P.walls.forEach(function(w){mnX=Math.min(mnX,w.x1,w.x2);mnY=Math.min(mnY,w.y1,w.y2);mxX=Math.max(mxX,w.x1,w.x2);mxY=Math.max(mxY,w.y1,w.y2)})}
  var cx=(mnX+mxX)/2, cz=(mnY+mxY)/2;
  var group=new THREE.Group();

  function buildWall(w){
    var dx=w.x2-w.x1,dz=w.y2-w.y1,len=Math.hypot(dx,dz); if(len<1)return;
    var h=w.height||270, th=w.thickness||20, ex=wallExt(w), c1=-ex.e1, endX=len+ex.e2;
    var ops=P.openings.filter(function(o){return o.wallId===w.id}).sort(function(a,b){return a.pos-b.pos});
    var wg=new THREE.Group(); wg.position.set(w.x1-cx,0,w.y1-cz); wg.rotation.y=-Math.atan2(dz,dx);
    var wallMat=new THREE.MeshLambertMaterial({color:new THREE.Color(w.color||'#f4efe6')});
    var glassMat=new THREE.MeshLambertMaterial({color:0x93c5fd,transparent:true,opacity:0.45});
    var doorMat=new THREE.MeshLambertMaterial({color:0xb45309});
    var cur=c1;
    function seg(x0,x1,y0,y1,z0,z1){
      var m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),wallMat);
      m.position.set((x0+x1)/2,(y0+y1)/2,0); m.castShadow=true; m.receiveShadow=true; wg.add(m);
    }
    ops.forEach(function(o){
      var oS=Math.max(0,o.pos-o.width/2), oE=Math.min(len,o.pos+o.width/2);
      if(oS>cur) seg(cur,oS,0,h,-th/2,th/2);
      var hl=oE-oS, hx=oS+hl/2, s=Math.max(0,o.sill||0), oh=Math.min(h-s,o.height||210), lint=Math.max(0,h-(s+oh));
      if(s>0) seg(oS,oE,0,s,-th/2,th/2);
      if(lint>0) seg(oS,oE,h-lint,h,-th/2,th/2);
      var isWin=o.type.indexOf('win')===0, isDoor=o.type.indexOf('door')===0;
      if(isWin){
        var g=new THREE.Mesh(new THREE.BoxGeometry(Math.max(1,hl-4),Math.max(1,oh-4),4),glassMat);
        g.position.set(hx,s+oh/2,0); wg.add(g);
      } else if(isDoor&&o.type!=='door-opening'){
        var lf=new THREE.Mesh(new THREE.BoxGeometry(Math.max(1,hl-3),Math.max(1,oh-2),6),doorMat);
        lf.position.set(hx,s+oh/2,0); lf.castShadow=true; wg.add(lf);
      }
      cur=oE;
    });
    if(cur<endX) seg(cur,endX,0,h,-th/2,th/2);
    group.add(wg);
  }

  function buildRoom(r){
    if(!r.points||r.points.length<3)return;
    var shape=new THREE.Shape(); shape.moveTo(r.points[0][0]-cx,-(r.points[0][1]-cz));
    for(var i=1;i<r.points.length;i++) shape.lineTo(r.points[i][0]-cx,-(r.points[i][1]-cz));
    shape.closePath();
    var fc=(r.floor&&r.floor.indexOf('#')===0)?r.floor:'#c8d9b8';
    var mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshLambertMaterial({color:new THREE.Color(fc),side:THREE.DoubleSide}));
    mesh.rotation.x=-Math.PI/2; mesh.position.y=0.5; group.add(mesh);
    if(r.showLabel!==false&&r.name){
      var area=(polyArea(r.points)/10000).toFixed(1).replace('.',',');
      var bb=polyBBox(r.points), dimStr=toD(bb.w)+' \u00d7 '+toD(bb.h)+' '+uLabel();
      var cv=document.createElement('canvas'); cv.width=512; cv.height=128;
      var lc=cv.getContext('2d');
      lc.fillStyle='rgba(255,255,255,0.75)'; lc.beginPath();
      if(lc.roundRect) lc.roundRect(4,4,504,120,12); else lc.rect(4,4,504,120);
      lc.fill();
      lc.textAlign='center'; lc.textBaseline='top';
      lc.fillStyle='#1e293b'; lc.font='bold 32px sans-serif'; lc.fillText(String(r.name).toUpperCase(),256,8);
      lc.fillStyle='#475569'; lc.font='22px sans-serif'; lc.fillText(dimStr,256,46);
      lc.fillStyle='#2563eb'; lc.font='bold 22px sans-serif'; lc.fillText(area+' m\u00b2',256,74);
      var tex=new THREE.CanvasTexture(cv);
      var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
      var mx=(bb.minX+bb.maxX)/2-cx, mz=(bb.minY+bb.maxY)/2-cz, sf=Math.min(bb.w,bb.h)*0.6;
      sp.scale.set(sf,sf*0.25,1); sp.position.set(mx,2,mz); group.add(sp);
    }
  }

  function buildFurn(f){
    var mat=new THREE.MeshLambertMaterial({color:new THREE.Color(f.color||'#a5754b')});
    var grp=new THREE.Group(); grp.position.set(f.x-cx,0,f.y-cz); grp.rotation.y=-(f.rot||0)*Math.PI/180;
    var W=f.w||100, D=f.d||60, H=f.h||75, t=f.type;
    if(t==='bed'){
      var bedB=new THREE.Mesh(new THREE.BoxGeometry(W,H*0.5,D),mat); bedB.position.set(0,H*0.25,0); grp.add(bedB);
      var pil=new THREE.Mesh(new THREE.BoxGeometry(W*0.9,H*0.15,D*0.3),new THREE.MeshLambertMaterial({color:0xffffff})); pil.position.set(0,H*0.55,-D*0.3); grp.add(pil);
    } else if(t==='sofa'){
      var seat=new THREE.Mesh(new THREE.BoxGeometry(W,H*0.5,D*0.65),mat); seat.position.set(0,H*0.25,D*0.15); grp.add(seat);
      var back=new THREE.Mesh(new THREE.BoxGeometry(W,H,D*0.3),mat); back.position.set(0,H*0.5,-D*0.35); grp.add(back);
      [-W/2+W*0.1,W/2-W*0.1].forEach(function(ax){var arm=new THREE.Mesh(new THREE.BoxGeometry(W*0.15,H*0.7,D),mat); arm.position.set(ax,H*0.35,0); grp.add(arm)});
    } else if(t==='toilet'){
      var bowl=new THREE.Mesh(new THREE.CylinderGeometry(W*0.4,W*0.35,H,16),mat); bowl.position.set(0,H/2,D*0.1); grp.add(bowl);
      var tank=new THREE.Mesh(new THREE.BoxGeometry(W*0.85,H*1.1,D*0.3),mat); tank.position.set(0,H*0.55,-D*0.35); grp.add(tank);
    } else if(t==='bath'){
      var outer=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),mat); outer.position.set(0,H/2,0); grp.add(outer);
      var inner=new THREE.Mesh(new THREE.BoxGeometry(W*0.85,H*0.6,D*0.75),new THREE.MeshLambertMaterial({color:0xdbeafe})); inner.position.set(0,H*0.75,0); grp.add(inner);
    } else {
      var box=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),mat); box.position.set(0,H/2,0); grp.add(box);
      if(t==='table'){
        var legMat=new THREE.MeshLambertMaterial({color:new THREE.Color(f.color||'#a5754b').multiplyScalar(0.75)});
        [[W/2-5,-D/2+5],[W/2-5,D/2-5],[-W/2+5,-D/2+5],[-W/2+5,D/2-5]].forEach(function(p){var leg=new THREE.Mesh(new THREE.BoxGeometry(8,H*0.9,8),legMat); leg.position.set(p[0],H*0.45,p[1]); grp.add(leg)});
      }
    }
    grp.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
    group.add(grp);
  }

  P.walls.forEach(buildWall); P.rooms.forEach(buildRoom); P.furniture.forEach(buildFurn);
  scene.add(group);

  var theta=Math.PI/4, phi=Math.PI/4, span=Math.max(mxX-mnX,mxY-mnY), dist=Math.max(800,span*1.6), tgt={x:0,y:0,z:0};
  function updateCam(){
    camera.position.set(tgt.x+dist*Math.sin(phi)*Math.sin(theta), tgt.y+dist*Math.cos(phi), tgt.z+dist*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(tgt.x,tgt.y,tgt.z);
  }
  function render(){ renderer.render(scene,camera) }
  updateCam(); render();

  var cv=renderer.domElement, drag=false, last=null, btn=0;
  cv.addEventListener('contextmenu',function(e){e.preventDefault()});
  cv.addEventListener('pointerdown',function(e){drag=true; last={x:e.clientX,y:e.clientY}; btn=e.button; e.preventDefault()});
  cv.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-last.x, dy=e.clientY-last.y; last={x:e.clientX,y:e.clientY};
    if(btn===0){ theta-=dx*0.01; phi=Math.max(0.05,Math.min(Math.PI/2-0.01,phi-dy*0.01)); }
    else{ var spd=dist*0.001; tgt.x-=Math.cos(theta)*dx*spd; tgt.z+=Math.sin(theta)*dx*spd; tgt.y+=dy*spd; }
    updateCam(); render();
  });
  cv.addEventListener('pointerup',function(){drag=false});
  cv.addEventListener('pointercancel',function(){drag=false});
  cv.addEventListener('wheel',function(e){e.preventDefault(); dist=Math.max(50,Math.min(9000,dist*(e.deltaY>0?1.12:0.9))); updateCam(); render();},{passive:false});

  var views={plan:{theta:0,phi:0.05},iso:{theta:Math.PI/4,phi:Math.PI/4},persp:{theta:Math.PI/5,phi:Math.PI/3.5},side:{theta:0,phi:Math.PI/4},corner:{theta:Math.PI*0.75,phi:Math.PI/4}};
  var vbtns=document.querySelectorAll('[data-v]');
  for(var bi=0;bi<vbtns.length;bi++){
    (function(b){
      b.addEventListener('click',function(){
        var v=views[b.getAttribute('data-v')]; if(!v)return;
        var st={theta:theta,phi:phi}, t0=performance.now(), dur=600;
        function step(now){
          var p=Math.min(1,(now-t0)/dur), e2=1-Math.pow(1-p,3);
          theta=st.theta+(v.theta-st.theta)*e2; phi=st.phi+(v.phi-st.phi)*e2;
          updateCam(); render(); if(p<1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });
    })(vbtns[bi]);
  }
  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight); render();
  });
})();
</script>
</body>
</html>
